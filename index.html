<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ROOMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    /* Base layout configuration */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color: #e4e4e7;
    }

    .font-creep { font-family: 'Creepster', cursive; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }

    /* Violent camera & screen shudder during jumpscare */
    @keyframes camera-violent-shake {
      0% { transform: translate(0, 0) rotate(0deg) scale(1.03); }
      10% { transform: translate(-22px, 16px) rotate(-2deg) scale(1.08); }
      20% { transform: translate(25px, -20px) rotate(2.2deg) scale(1.1); }
      30% { transform: translate(-28px, -14px) rotate(-2.5deg) scale(1.06); }
      40% { transform: translate(22px, 24px) rotate(2deg) scale(1.11); }
      50% { transform: translate(-24px, 18px) rotate(-1.5deg) scale(1.07); }
      60% { transform: translate(26px, -18px) rotate(2.5deg) scale(1.12); }
      70% { transform: translate(-18px, -24px) rotate(-2deg) scale(1.08); }
      80% { transform: translate(22px, 16px) rotate(1.8deg) scale(1.09); }
      90% { transform: translate(-16px, 12px) rotate(-1.2deg) scale(1.05); }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    }
    .shake-active {
      animation: camera-violent-shake 0.07s infinite !important;
    }

    /* Red alarm adrenaline strobe */
    /* (광과민성 안전) 빠른 깜빡임 제거: 느리고 낮은 대비의 붉은 맥박 */
    @keyframes red-strobe {
      0%, 100% { background-color: rgba(200, 20, 20, 0.50); }
      50% { background-color: rgba(200, 20, 20, 0.62); }
    }
    .strobe-active {
      animation: red-strobe 1.2s infinite ease-in-out !important;
    }

    /* Monster sudden lunge forward from shadows */
    @keyframes monster-lunge-entry {
      0% {
        transform: scale(0.22) translateY(90px) rotate(-8deg);
        opacity: 0.2;
        filter: brightness(0.2) contrast(200%) blur(8px);
      }
      100% {
        transform: scale(1.36) translateY(0) rotate(0deg);
        opacity: 1;
        filter: brightness(1.25) contrast(135%) blur(0px);
      }
    }

    /* Frantic thrashing and roaring right in front of player's face */
    @keyframes monster-violent-spasm {
      0% { transform: scale(1.36) translate(0, 0) rotate(0deg); }
      15% { transform: scale(1.48) translate(-26px, 18px) rotate(5deg); }
      30% { transform: scale(1.3) translate(28px, -22px) rotate(-6deg); }
      45% { transform: scale(1.5) translate(-20px, -20px) rotate(4deg); }
      60% { transform: scale(1.32) translate(26px, 24px) rotate(-5deg); }
      75% { transform: scale(1.47) translate(-28px, 16px) rotate(6deg); }
      90% { transform: scale(1.34) translate(20px, -18px) rotate(-4deg); }
      100% { transform: scale(1.4) translate(0, 0) rotate(0deg); }
    }

    .monster-jumpscare-active {
      animation: monster-lunge-entry 0.09s cubic-bezier(0.12, 0.95, 0.22, 1.35) forwards,
                 monster-violent-spasm 0.075s 0.09s infinite !important;
      transform-origin: center center;
      will-change: transform, filter;
    }

    /* Pulsing horror vignette */
    @keyframes pulse-vignette {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 0.9; }
    }
    .vignette-pulse {
      animation: pulse-vignette 1.2s infinite alternate ease-in-out;
    }

    /* Skibidi toilet popup animation */
    @keyframes skibidi-rise {
      0% { transform: translateY(80%) scale(0.4); opacity: 0; }
      50% { transform: translateY(-8%) scale(1.15); opacity: 1; }
      75% { transform: translateY(4%) scale(1.05); }
      100% { transform: translateY(0%) scale(1.1); opacity: 1; }
    }
    .skibidi-active {
      animation: skibidi-rise 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    /* Hidden interactive object hotspot */
    .hotspot-target {
      position: absolute;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.001);
      z-index: 25;
      -webkit-tap-highlight-color: transparent;
    }

    /* Persistent Room Navigation Indicator */
    .hotspot-nav {
      position: absolute;
      cursor: pointer;
      border: 2px dashed rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      z-index: 26;
      animation: nav-pulse 2s infinite ease-in-out;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, border-color 0.2s;
    }
    .hotspot-nav:hover {
      background: rgba(239, 68, 68, 0.22);
      border-color: rgba(248, 113, 113, 0.9);
    }
    @keyframes nav-pulse {
      0%, 100% { border-color: rgba(255, 255, 255, 0.35); box-shadow: 0 0 6px rgba(255, 255, 255, 0.1); }
      50% { border-color: rgba(255, 255, 255, 0.7); box-shadow: 0 0 14px rgba(255, 255, 255, 0.3); }
    }

    /* Minimal Game Frame */
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 800px;
      aspect-ratio: 16 / 10;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      overflow: hidden;
      margin: auto;
    }

    #scene-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
  </style>
</head>

<body class="flex items-center justify-center w-screen h-screen overflow-hidden bg-black select-none">

      <span class="text-xs font-mono text-neutral-400 shrink-0">소지품:</span>
      <div id="inventory-slots" class="flex space-x-2">
        <!-- Dynamic inventory slots -->
      </div>
    </footer>

    <!-- Game Over Screen Layer -->
    <div id="gameover-layer" class="absolute inset-0 z-50 hidden flex-col items-center justify-end pb-8 bg-black select-none">
      <img id="gameover-bg" src="./gameover.jpg" alt="Game Over" class="absolute inset-0 w-full h-full object-cover">
      <div class="relative z-10 flex space-x-4 mb-4">
        <button id="retry-btn" class="px-6 py-2 bg-neutral-900/80 hover:bg-neutral-800 border border-neutral-600 rounded text-xs text-neutral-200 font-mono tracking-wider transition-all">다시 시도</button>
        <button id="menu-btn" class="px-6 py-2 bg-neutral-900/80 hover:bg-neutral-800 border border-neutral-600 rounded text-xs text-neutral-200 font-mono tracking-wider transition-all">메인 메뉴</button>
      </div>
    </div>

    <!-- Game Clear Screen Layer -->
    <div id="gameclear-layer" class="absolute inset-0 z-50 hidden flex-col items-center justify-center p-4 bg-black/95 text-center select-none">
      <h2 class="font-creep text-4xl text-green-500 mb-2">ESCAPE SUCCESSFUL</h2>
      <p class="text-xs font-mono text-neutral-400 mb-6">
        당신은 백룸의 모든 엔티티를 따돌리고 차가운 바깥 세계로 빠져나왔습니다.
      </p>
      <button id="clear-retry-btn" class="px-6 py-2 bg-neutral-800 hover:bg-neutral-700 border border-green-600 text-green-400 rounded text-xs font-mono tracking-wider">처음부터 다시하기</button>
    </div>

    <!-- Start Title Screen Layer -->
    <div id="title-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black select-none p-4">
      <img src="./start.jpg" alt="Title Background" class="absolute inset-0 w-full h-full object-cover opacity-80">
      <div class="relative z-10 flex flex-col items-center text-center">
        <h1 class="font-creep text-6xl sm:text-8xl text-red-600 tracking-wider mb-8">THE ROOMS</h1>
        <button id="start-btn" class="px-10 py-3 bg-neutral-900/90 hover:bg-neutral-800 border border-red-700 text-red-200 rounded font-mono text-sm tracking-widest transition-all">게임 시작</button>
      </div>
    </div>

  </div>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.bgmGain = null;
        this.muted = false;
        this.bgmNodes = [];
        this.activeJumpscareAudio = null;
        this.activeSadAudio = null;
        this.sadTimer = null;
        this.randomScreamInterval = null;

        this.sfxPaths = {
          click: './mouseClick.wav',
          door: './SFX_Player_DoorOpening.wav',
          item: './SFX_Player_ItemPickup.wav',
          skibidi: './뿌직.mp3',
          girlSad: './girl_sad.mp3',
          walking: './walking.m4a',
          nttWalking: './ntt_walking.mp3',
          darkSoulsDeath: './다크소울 죽음.m4a',
          pageFlip: './page-flip-6.wav',
          glassBreak: './쨍그랑.mp3',
          randomScream: './ntt_scream.mp3',
          b_scream: './b_nttscream.mp3',
          restaurant_scream: './restaurant_nttscream.m4a',
          exit_scream: './EXIT_nttscream.mp3',
          library_scream: './library_nttscream.m4a'
        };
      }

      init() {
        if (this.ctx) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        this.ctx = new AudioContextClass();

        const compressor = this.ctx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-18, this.ctx.currentTime);
        compressor.knee.setValueAtTime(24, this.ctx.currentTime);
        compressor.ratio.setValueAtTime(8, this.ctx.currentTime);
        compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
        compressor.release.setValueAtTime(0.25, this.ctx.currentTime);
        compressor.connect(this.ctx.destination);

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.9, this.ctx.currentTime);
        this.masterGain.connect(compressor);

        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        this.bgmGain.connect(this.masterGain);
      }

      startBGM() {
        this.init();
        if (!this.ctx || this.bgmNodes.length > 0) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        osc1.type = 'sine';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(78.0, this.ctx.currentTime);
        osc2.frequency.setValueAtTime(78.06, this.ctx.currentTime);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(160, this.ctx.currentTime);

        const filterLfo = this.ctx.createOscillator();
        const filterLfoGain = this.ctx.createGain();
        filterLfo.frequency.setValueAtTime(0.055, this.ctx.currentTime);
        filterLfoGain.gain.setValueAtTime(75, this.ctx.currentTime);
        filterLfo.connect(filterLfoGain);
        filterLfoGain.connect(filter.frequency);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(this.bgmGain);

        osc1.start();
        osc2.start();
        filterLfo.start();

        this.bgmNodes = [osc1, osc2, filterLfo];
        this.startRandomAmbientScreams();
      }

      stopBGM() {
        this.bgmNodes.forEach(n => {
          try { n.stop(); n.disconnect(); } catch (e) {}
        });
        this.bgmNodes = [];
        this.stopRandomAmbientScreams();
      }

      startRandomAmbientScreams() {
        this.stopRandomAmbientScreams();
        this.randomScreamInterval = setInterval(() => {
          if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying) return;
          if (Math.random() < 0.35) {
            this.playSound('randomScream', 0.16);
          }
        }, 14000);
      }

      stopRandomAmbientScreams() {
        if (this.randomScreamInterval) {
          clearInterval(this.randomScreamInterval);
          this.randomScreamInterval = null;
        }
      }

      playSound(name, volume = 0.7) {
        if (this.muted) return;
        const path = this.sfxPaths[name];
        if (!path) return;
        try {
          const audioEl = new Audio(path);
          audioEl.volume = Math.max(0, Math.min(1, volume));
          audioEl.play().catch(() => {});
        } catch (e) {}
      }

      playClick() { this.playSound('click', 0.5); }
      playItemPickup() { this.playSound('item', 0.7); }
      playDoorOpen() { this.playSound('door', 0.75); }
      playWalking() { this.playSound('walking', 0.65); }
      playPageFlip() { this.playSound('pageFlip', 0.75); }
      playGlassBreak() { this.playSound('glassBreak', 0.25); }
      playNttWalking() { this.playSound('nttWalking', 0.6); }

      playGirlSad() {
        if (this.muted) return;
        try {
          if (this.activeSadAudio) {
            try { this.activeSadAudio.pause(); } catch(e) {}
          }
          if (this.sadTimer) {
            clearTimeout(this.sadTimer);
          }
          const audioEl = new Audio(this.sfxPaths.girlSad);
          audioEl.volume = 0.18;
          this.activeSadAudio = audioEl;
          audioEl.play().catch(() => {});

          this.sadTimer = setTimeout(() => {
            if (this.activeSadAudio) {
              try { this.activeSadAudio.pause(); } catch(e) {}
              this.activeSadAudio = null;
            }
          }, 27000);
        } catch (e) {}
      }

      playPowerOnSound() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(60, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.35);

          gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.45);
        } catch (e) {}
      }

      playSkibidiFlush() {
        if (this.muted) return;
        try {
          const sfx = new Audio(this.sfxPaths.skibidi);
          sfx.volume = 0.85;
          sfx.play().catch(() => {});
        } catch (e) {}
      }

      playEntityJumpscare(roomName) {
        if (this.muted) return;
        this.stopJumpscare();

        let soundKey = 'b_scream';
        if (roomName === 'library' || roomName === 'library_boss') {
          soundKey = 'library_scream';
        } else if (roomName === 'restaurant' || roomName === 'restaurant_toilet' || roomName === 'toilet') {
          soundKey = 'restaurant_scream';
        } else if (roomName === 'EXIT') {
          soundKey = 'exit_scream';
        }

        const path = this.sfxPaths[soundKey];
        if (!path) return;
        try {
          const audioEl = new Audio(path);
          audioEl.volume = 0.85;
          this.activeJumpscareAudio = audioEl;
          audioEl.play().catch(() => {});
        } catch (e) {}
      }

      stopJumpscare() {
        if (this.activeJumpscareAudio) {
          try {
            this.activeJumpscareAudio.pause();
            this.activeJumpscareAudio.currentTime = 0;
          } catch (e) {}
          this.activeJumpscareAudio = null;
        }
      }

      playGameOver() {
        if (this.muted) return;
        this.stopBGM();
        if (this.activeSadAudio) {
          try { this.activeSadAudio.pause(); } catch(e) {}
        }
        this.playSound('darkSoulsDeath', 0.45);
      }
    }

    const audio = new SoundEngine();
    window.audio = audio;
  </script>

  <script>
    window.gameState = {
      currentRoom: 'B2',
      maxStrikes: 5,
      livesLost: 0,
      inventory: [],
      isJumpscarePlaying: false,
      isGameOver: false,
      isGameClear: false,
      isModalOpen: false,
      idleSeconds: 0,
      idleThresholdSeconds: 35,
      flags: {
        b2PowerOn: false,
        b2DoorUnlocked: false,
        b1RoomPuzzleSolved: false,
        b1RightLeverFound: false,
        b1BossDoorUnlocked: false,
        libraryBossClueFound: false,
        libraryKeyFound: false,
        libraryDoorOpen: false,
        vendingMachineSolved: false,
        restaurantDoorOpen: false,
        restaurantToiletSoundPlayed: false,
        toiletKeycardFound: false,
        toiletMirrorBroken: false,
        exitBreakerPulled: false
      }
    };

    const roomBackgrounds = {
      'B2': './B2.jpg',
      'B2_open': './B2_open.jpg',
      'B1': './B1.jpg',
      'B1_room': './B1_room.jpg',
      'B1_right': './B1_right.jpg',
      'library_boss': './library_boss.jpg',
      'library': './library.jpg',
      'restaurant': './restaurant.jpg',
      'restaurant_toilet': './restaurant_toilet.jpg',
      'toilet': './toilet.jpg',
      'skibiditoilet': './skibiditoilet.jpg',
      'EXIT': './EXIT.jpg'
    };

    const roomMonsters = {
      'B2': './B_ntt.png',
      'B2_open': './B_ntt.png',
      'B1': './B_ntt.png',
      'B1_room': './B_ntt.png',
      'B1_right': './B_ntt.png',
      'library_boss': './library_ntt.png',
      'library': './library_ntt.png',
      'restaurant': './restaurant_ntt.png',
      'restaurant_toilet': './restaurant_ntt.png',
      'toilet': './restaurant_ntt.png',
      'skibiditoilet': './skibidi_ntt.png',
      'EXIT': './EXIT_ntt.png'
    };

    const roomDifficultySettings = {
      'B2': { idleThreshold: 45 },
      'B2_open': { idleThreshold: 40 },
      'B1': { idleThreshold: 35 },
      'B1_room': { idleThreshold: 35 },
      'B1_right': { idleThreshold: 35 },
      'library_boss': { idleThreshold: 32 },
      'library': { idleThreshold: 30 },
      'restaurant': { idleThreshold: 28 },
      'restaurant_toilet': { idleThreshold: 28 },
      'toilet': { idleThreshold: 28 },
      'skibiditoilet': { idleThreshold: 35 },
      'EXIT': { idleThreshold: 24 }
    };

    // Instant image cache preload engine to avoid visual lag on mobile
    const preloadedImages = {};
    function preloadAllImages() {
      const allPaths = Object.values(roomBackgrounds).concat(Object.values(roomMonsters)).concat(['./start.jpg', './gameover.jpg']);
      allPaths.forEach(path => {
        const img = new Image();
        img.src = path;
        if (img.decode) {
          img.decode().catch(() => {});
        }
        preloadedImages[path] = img;
      });
    }
    preloadAllImages();

    // Hotspot coordinates configured for accurate 16:10 fixed aspect container
    const roomHotspots = {
      'B2': [
        { id: 'b2-breaker', type: 'obj', rect: { left: '3%', top: '24%', width: '10%', height: '28%' }, action: () => handleB2Breaker() },
        { id: 'b2-boiler', type: 'obj', rect: { left: '25%', top: '37%', width: '11%', height: '33%' }, action: () => audio.playClick() },
        { id: 'b2-exit-door', type: 'nav', rect: { left: '60%', top: '36%', width: '13%', height: '23%' }, action: () => handleB2Door() },
        { id: 'b2-dark-trap', type: 'obj', rect: { left: '39%', top: '39%', width: '9%', height: '26%' }, action: () => triggerMonsterTrap('B2') }

  <script>
    let toastTimeout = null;
    function showToast(text) {
      const toast = document.getElementById('toast-notify');
      const toastText = document.getElementById('toast-text');
      if (!toast || !toastText) return;
      toastText.innerHTML = text;
      toast.classList.remove('hidden');
      toast.style.opacity = '1';
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.classList.add('hidden'), 200);
      }, 2600);
    }

    function addItem(name, label) {
      if (window.gameState.inventory.length >= 4) return;
      window.gameState.inventory.push({ name, label });
      renderInventory();
    }

    function renderInventory() {
      const container = document.getElementById('inventory-slots');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const item = window.gameState.inventory[i];
        const slot = document.createElement('div');
        slot.className = 'w-9 h-9 sm:w-10 sm:h-10 rounded border flex items-center justify-center text-[10px] font-mono p-1 text-center transition-all duration-200';
        if (item) {
          slot.className += ' border-amber-600/80 bg-neutral-900/90 text-amber-300 font-bold';
          slot.innerHTML = `<span class="truncate w-full leading-tight">${item.label}</span>`;
        } else {
          slot.className += ' border-neutral-800 bg-neutral-950/60 text-neutral-600';
          slot.innerHTML = `<span class="text-[9px] opacity-40">-</span>`;
        }
        container.appendChild(slot);
      }
    }

    function handleB2Breaker() {
      if (!window.gameState.flags.b2PowerOn) {
        window.gameState.flags.b2PowerOn = true;
        audio.playPowerOnSound();
        showToast('배전반 메인 전력 복구 완료');
      } else {
        audio.playClick();
      }
    }

    function handleB2Door() {
      if (!window.gameState.flags.b2PowerOn) {
        audio.playClick();
        showToast('잠겨있다.');
        return;
      }
      audio.playDoorOpen();
      setTimeout(() => changeRoom('B2_open'), 300);
    }

    function handleB1BossDoor() {
      const cond1 = window.gameState.flags.b1RoomPuzzleSolved;
      const cond2 = window.gameState.flags.b1RightLeverFound;
      if (!cond1 || !cond2) {
        audio.playClick();
        showToast('잠겨있다.');
        return;
      }
      window.gameState.flags.b1BossDoorUnlocked = true;
      audio.playDoorOpen();
      setTimeout(() => changeRoom('library_boss'), 250);
    }

    function openB1ClueModal() {
      audio.playClick();
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      card.innerHTML = `
        <div class="flex items-center justify-between mb-3 border-b border-white/[0.08] pb-2">
          <span class="text-xs font-mono-tech text-amber-400 font-bold uppercase tracking-wider">LOG : DIARY</span>
          <span class="text-[10px] font-mono-tech text-zinc-500">ENGINEER FILE</span>
        </div>
        <div class="p-3.5 bg-black/50 border border-amber-900/40 rounded-xl text-left mb-4 font-mono text-[11px] sm:text-xs text-zinc-300 leading-relaxed shadow-inner">
          <p class="mb-2 text-zinc-400 font-mono-tech">"정전 시 비상 전압 분배기 순서 복구 지침서"</p>
          <ul class="space-y-1.5 text-amber-200">
            <li>• <strong class="text-white">1번구 :</strong> 1을 제외한 홀수 중 최소 소수</li>
            <li>• <strong class="text-white">2번구 :</strong> 전체 중 최소 소수</li>
            <li>• <strong class="text-white">3번구 :</strong> 1~4 중 남은 유일한 홀수</li>
            <li>• <strong class="text-white">4번구 :</strong> 2의 거듭제곱 (2²)</li>
          </ul>
        </div>
        <button onclick="closePuzzleModal()" class="w-full py-2.5 bg-zinc-800/80 hover:bg-zinc-700 active:scale-95 border border-white/10 rounded-xl font-mono-tech text-xs text-zinc-200 tracking-wider transition-all shadow-md">닫기</button>
      `;
      modal.classList.remove('hidden');
    }

    let b1SwitchesState = [];
    function openB1RoomPuzzle() {
      if (window.gameState.flags.b1RoomPuzzleSolved) {
        showToast('동력 제어반 회로가 이미 정상 가동 중입니다.');
        return;
      }
      b1SwitchesState = [];
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      renderB1PuzzleUI(card);
      modal.classList.remove('hidden');
    }

    function renderB1PuzzleUI(card) {
      card.innerHTML = `
        <div class="flex items-center justify-between mb-2 border-b border-white/[0.08] pb-2">
          <span class="text-xs font-mono-tech text-amber-400 font-bold uppercase tracking-wider">CIRCUIT CONTROLLER</span>
          <span class="text-[10px] font-mono-tech text-zinc-500">VOLTAGE BREAKER</span>
        </div>
        <p class="text-[11px] text-zinc-400 mb-3 leading-relaxed text-left">
          작업대 다이어리의 수수께끼를 바탕으로 4개 스위치 번호를 순서대로 누르십시오.
        </p>
        <div class="grid grid-cols-4 gap-2 mb-3">
          ${[1, 2, 3, 4].map(num => `
            <button onclick="pressB1Switch(${num})" class="py-3 bg-zinc-800/90 hover:bg-amber-950/60 active:scale-95 border border-white/10 hover:border-amber-500 rounded-xl text-xs sm:text-sm font-mono-tech text-amber-300 font-bold transition-all shadow-sm">SW ${num}</button>
          `).join('')}
        </div>
        <div class="py-2 px-3 bg-black/60 border border-white/10 rounded-xl text-[11px] font-mono-tech text-zinc-300 mb-3 text-center">
          SEQUENCE: [ <span class="text-amber-400 font-bold">${b1SwitchesState.join(' - ') || 'READY'}</span> ]
        </div>
        <div class="flex space-x-2">
          <button onclick="resetB1Puzzle()" class="w-1/2 py-2 bg-zinc-900/80 hover:bg-zinc-800 active:scale-95 border border-white/10 rounded-xl text-xs text-zinc-400 transition-all">초기화</button>
          <button onclick="closePuzzleModal()" class="w-1/2 py-2 bg-zinc-800/80 hover:bg-zinc-700 active:scale-95 border border-white/10 rounded-xl text-xs text-zinc-200 transition-all">닫기</button>
        </div>
      `;
    }

    window.pressB1Switch = function(num) {
      audio.playClick();
      b1SwitchesState.push(num);
      const card = document.getElementById('puzzle-card');
      renderB1PuzzleUI(card);

      const target = [3, 2, 1, 4];
      if (b1SwitchesState.length === 4) {
        if (b1SwitchesState.every((v, i) => v === target[i])) {
          window.gameState.flags.b1RoomPuzzleSolved = true;
          audio.playPowerOnSound();
          closePuzzleModal();
          showToast('동력 제어반 전압 회로 연결 완료');
        } else {
          setTimeout(() => {
            b1SwitchesState = [];
            renderB1PuzzleUI(card);
            audio.playClick();
          }, 350);
        }
      }
    };

    window.resetB1Puzzle = function() {
      b1SwitchesState = [];
      renderB1PuzzleUI(document.getElementById('puzzle-card'));
    };

    let b1LockerCode = '';
    function handleB1RightLocker() {
      if (window.gameState.flags.b1RightLeverFound) {
        audio.playClick();
        return;
      }
      b1LockerCode = '';
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      renderB1LockerUI(card);
      modal.classList.remove('hidden');
    }

    function renderB1LockerUI(card) {
      card.innerHTML = `
        <div class="flex items-center justify-between mb-2 border-b border-white/[0.08] pb-2">
          <span class="text-xs font-mono-tech text-amber-400 font-bold uppercase tracking-wider">DIAL LOCK</span>
          <span class="text-[10px] font-mono-tech text-zinc-500">STORAGE LOCKER</span>
        </div>
        <p class="text-[11px] text-zinc-400 mb-2 leading-relaxed text-left">
          녹슨 라커 손잡이에 긁힌 글귀:<br>
          <span class="text-amber-300 font-mono text-[11px]">"1을 제외한 가장 작은 제곱수 / 0~9의 정중앙 수 / 3²"</span>
        </p>
        <div class="w-full py-2.5 bg-black/70 border border-amber-900/60 rounded-xl font-mono text-lg text-amber-400 tracking-widest text-center mb-3 shadow-inner">
          ${b1LockerCode ? b1LockerCode.padEnd(3, ' _ ') : '_ _ _'}
        </div>
        <div class="grid grid-cols-3 gap-1.5 mb-3 max-w-[220px] mx-auto">
          ${[1,2,3,4,5,6,7,8,9].map(n => `
            <button onclick="pressLockerNum('${n}')" class="py-2.5 bg-zinc-800/90 hover:bg-zinc-700 active:scale-95 border border-white/10 rounded-xl font-mono text-sm text-zinc-200 transition-all">${n}</button>
          `).join('')}
          <button onclick="clearLockerNum()" class="py-2.5 bg-zinc-900/90 hover:bg-zinc-800 active:scale-95 border border-white/10 rounded-xl font-mono text-xs text-zinc-400 transition-all">CLR</button>
          <button onclick="pressLockerNum('0')" class="py-2.5 bg-zinc-800/90 hover:bg-zinc-700 active:scale-95 border border-white/10 rounded-xl font-mono text-sm text-zinc-200 transition-all">0</button>
          <button onclick="closePuzzleModal()" class="py-2.5 bg-zinc-900/90 hover:bg-zinc-800 active:scale-95 border border-white/10 rounded-xl font-mono text-xs text-zinc-400 transition-all">EXIT</button>
        </div>
      `;
    }

    window.pressLockerNum = function(n) {
      audio.playClick();
      if (b1LockerCode.length < 3) b1LockerCode += n;
      renderB1LockerUI(document.getElementById('puzzle-card'));

      if (b1LockerCode.length === 3) {
        if (b1LockerCode === '459') {
          window.gameState.flags.b1RightLeverFound = true;
          addItem('비상 계단 레버', '레버');
          audio.playItemPickup();
          closePuzzleModal();
          showToast('비상 계단 레버 획득');
        } else {
          setTimeout(() => {
            b1LockerCode = '';
            renderB1LockerUI(document.getElementById('puzzle-card'));
          }, 350);
        }
      }
    };
    window.clearLockerNum = function() {
      b1LockerCode = '';
      renderB1LockerUI(document.getElementById('puzzle-card'));
    };

    function handleLibraryBossBook() {
      window.gameState.flags.libraryBossClueFound = true;
      audio.playPageFlip();
      showToast('고서의 메모: "서재(library) 좌측 고서적 서가 가장 밑단 흑색 서적 뒤편"');
    }

    function handleLibrarySecretShelf() {
      if (!window.gameState.flags.libraryBossClueFound) {
        audio.playClick();
        return;
      }
      if (!window.gameState.flags.libraryKeyFound) {
        window.gameState.flags.libraryKeyFound = true;
        addItem('식당 열쇠', '열쇠');
        audio.playItemPickup();
        showToast('식당 열쇠 획득');
      } else {
        audio.playClick();
      }
    }

    function handleLibraryDoor() {
      if (!window.gameState.flags.libraryKeyFound) {
        audio.playClick();
        showToast('잠겨있다.');
        return;
      }
      window.gameState.flags.libraryDoorOpen = true;
      audio.playDoorOpen();
      setTimeout(() => changeRoom('restaurant'), 200);
    }

    function openVendingPuzzle() {
      audio.playClick();
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      card.innerHTML = `
        <div class="flex items-center justify-between mb-2 border-b border-white/[0.08] pb-2">
          <span class="text-xs font-mono-tech text-amber-400 font-bold uppercase tracking-wider">VENDING LOG</span>
          <span class="text-[10px] font-mono-tech text-zinc-500">MAINTENANCE NOTE</span>
        </div>
        <p class="text-[11px] text-zinc-400 mb-3 text-left">
          자판기 배출구에서 찢겨진 관리 수식 쪽지가 떨어집니다.
        </p>
        <div class="p-3 bg-black/60 border border-amber-900/40 rounded-xl text-left mb-4 font-mono text-[11px] text-zinc-300 leading-relaxed shadow-inner">
          <span class="text-amber-400 font-bold block mb-1 font-mono-tech tracking-wide">■ EXIT SECURITY COMBINATION</span>
          • 앞 2자리 (X) : 7 × 8 = ?<br>
          • 뒤 2자리 (Y) : 100 - 63 = ?<br>
          <span class="text-amber-300 font-bold block mt-1.5 font-mono-tech">➔ PASSWORD = [ X ][ Y ]</span>
        </div>
        <button onclick="closePuzzleModal()" class="w-full py-2.5 bg-zinc-800/80 hover:bg-zinc-700 active:scale-95 border border-white/10 rounded-xl font-mono-tech text-xs text-zinc-200 tracking-wider transition-all shadow-md">닫기</button>
      `;
      modal.classList.remove('hidden');
    }

    let inputKeypadPw = '';
    function openRestaurantKeypad() {
      if (window.gameState.flags.restaurantDoorOpen) {
        audio.playWalking();
        setTimeout(() => changeRoom('EXIT'), 200);
        return;
      }
      inputKeypadPw = '';
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      renderKeypadUI(card);
      modal.classList.remove('hidden');
    }

    function renderKeypadUI(card) {
      card.innerHTML = `
        <div class="flex items-center justify-between mb-2 border-b border-red-900/30 pb-2">
          <span class="text-xs font-mono-tech text-red-500 font-bold uppercase tracking-wider">TERMINAL ACCESS</span>
          <span class="text-[10px] font-mono-tech text-red-400/70">EXIT DOOR LOCK</span>
        </div>
        <div class="w-full py-2.5 bg-black/80 border border-red-900/60 rounded-xl font-mono-tech text-lg text-red-400 tracking-[0.25em] text-center mb-3 shadow-inner">
          ${inputKeypadPw ? inputKeypadPw.padEnd(4, ' _ ') : '_ _ _ _'}
        </div>
        <div class="grid grid-cols-3 gap-1.5 mb-3 max-w-[220px] mx-auto">
          ${[1,2,3,4,5,6,7,8,9].map(n => `
            <button onclick="pressKeypadNum('${n}')" class="py-2.5 bg-zinc-800/90 hover:bg-red-950/40 active:scale-95 border border-white/10 hover:border-red-500/50 rounded-xl font-mono-tech text-sm text-zinc-200 transition-all">${n}</button>
          `).join('')}
          <button onclick="clearKeypadNum()" class="py-2.5 bg-zinc-900/90 hover:bg-zinc-800 active:scale-95 border border-white/10 rounded-xl font-mono-tech text-xs text-zinc-400 transition-all">CLR</button>
          <button onclick="pressKeypadNum('0')" class="py-2.5 bg-zinc-800/90 hover:bg-red-950/40 active:scale-95 border border-white/10 hover:border-red-500/50 rounded-xl font-mono-tech text-sm text-zinc-200 transition-all">0</button>
          <button onclick="closePuzzleModal()" class="py-2.5 bg-zinc-900/90 hover:bg-zinc-800 active:scale-95 border border-white/10 rounded-xl font-mono-tech text-xs text-zinc-400 transition-all">EXIT</button>
        </div>
      `;
    }

    window.pressKeypadNum = function(n) {
      audio.playClick();
      if (inputKeypadPw.length < 4) inputKeypadPw += n;
      renderKeypadUI(document.getElementById('puzzle-card'));

      if (inputKeypadPw.length === 4) {
        if (inputKeypadPw === '5637') {
          window.gameState.flags.restaurantDoorOpen = true;
          audio.playDoorOpen();
          setTimeout(() => {
            closePuzzleModal();
            changeRoom('EXIT');
          }, 250);
        } else {
          setTimeout(() => {
            inputKeypadPw = '';
            renderKeypadUI(document.getElementById('puzzle-card'));
          }, 300);
        }
      }
    };
    window.clearKeypadNum = function() {
      inputKeypadPw = '';
      renderKeypadUI(document.getElementById('puzzle-card'));
    };

    function handleGoToRestaurantToilet() {
      if (!window.gameState.flags.restaurantToiletSoundPlayed) {
        window.gameState.flags.restaurantToiletSoundPlayed = true;
        audio.playGirlSad();
      } else {
        audio.playWalking();
      }
      setTimeout(() => changeRoom('restaurant_toilet'), 200);
    }

    function handleToiletMirror() {
      if (!window.gameState.flags.toiletMirrorBroken) {
        window.gameState.flags.toiletMirrorBroken = true;
        audio.playGlassBreak();
        showToast('거울에 금이 가며 깨지는 소리가 울렸습니다.');
      } else {
        audio.playClick();
      }
    }

    function handleToiletFloorTile() {
      if (!window.gameState.flags.toiletKeycardFound) {
        window.gameState.flags.toiletKeycardFound = true;
        addItem('EXIT 마스터 키카드', '키카드');
        audio.playItemPickup();
        showToast('EXIT 마스터 키카드 획득');
      } else {
        audio.playClick();
      }
    }

    function handleExitFireCabinet() {
      if (!window.gameState.flags.exitBreakerPulled) {
        window.gameState.flags.exitBreakerPulled = true;
        audio.playItemPickup();
        showToast('소화전 비상 전원 해제 완료');
      } else {
        audio.playClick();
      }
    }

    function handleFinalExitDoor() {
      const pwr = window.gameState.flags.exitBreakerPulled;
      const key = window.gameState.flags.toiletKeycardFound;
      if (!pwr || !key) {
        audio.playClick();
        showToast('잠겨있다.');
        return;
      }
      window.gameState.isGameClear = true;
      audio.playDoorOpen();
      document.getElementById('gameclear-layer').classList.remove('hidden');
      document.getElementById('gameclear-layer').classList.add('flex');
    }
  </script>

  <script>

    /* =====================================================================
       _ntt 이미지 점프스케어 연출 엔진 (requestAnimationFrame 기반)
       - 등장: 0.14초 만에 어둠 속에서 화면 앞으로 확 튀어나옴 (밝기 플래시 포함)
       - 이후: 30~60ms마다 위치/회전/크기/기울기를 무작위로 끊어서 튀게 만들어 '발작' 느낌
       - 0.5초 안팎마다 더 강한 폭주 구간, 가끔 좌우 반전 / 색 반전 글리치
       - 화면 전체도 같이 흔들림
       ===================================================================== */
    const nttFx = { raf: null, cleanup: null };

    function stopNttFx() {
      if (nttFx.raf) cancelAnimationFrame(nttFx.raf);
      nttFx.raf = null;
      if (nttFx.cleanup) nttFx.cleanup();
      nttFx.cleanup = null;
    }

    function startNttFx(img, shakeTargets, opts) {
      stopNttFx();
      const o = Object.assign({ duration: 3000, power: 1, size: 1, shake: 1 }, opts || {});
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        o.power *= 0.4; o.shake = 0;
      }
      const rnd = (a) => (Math.random() * 2 - 1) * a;
      const BASE_FILTER = 'brightness(1.25) contrast(1.35) drop-shadow(0 0 35px rgba(0,0,0,0.95))';
      const LUNGE = 140;

      let st = { x: 0, y: 0, r: 0, s: 1.4 * o.size, skew: 0, flip: 1 };
      let nextJitter = 0, nextShake = 0;
      let burstUntil = 0;
      let nextBurst = 0;
            let lastFilter = '';
      let t0 = null;

      img.style.transformOrigin = 'center center';
      img.style.willChange = 'transform, filter, opacity';
      // 첫 프레임 전에 원본 크기로 번쩍 보이는 것 방지
      img.style.transform = 'scale(0.2)';
      img.style.opacity = '0.3';

      nttFx.cleanup = () => {
        img.style.transform = '';
        img.style.filter = '';
        img.style.opacity = '';
        img.style.willChange = '';
        (shakeTargets || []).forEach(el => { if (el) el.style.transform = ''; });
      };

      function frame(now) {
        if (t0 === null) {
          t0 = now;
          nextBurst = now + 450 + Math.random() * 300;
        }
        const t = now - t0;
        if (t >= o.duration) { nttFx.raf = null; return; }

        const P = o.power * (1 + (t / o.duration) * 0.5); // 시간이 갈수록 점점 더 발작
        let transform, filter, opacity = 1;

        if (t < LUNGE) {
          // 1단계: 어둠 속에서 얼굴 앞으로 돌진
          const p = t / LUNGE;
          const e = 1 - Math.pow(1 - p, 3);
          const sc = (0.2 + (1.5 * o.size - 0.2) * e).toFixed(3);
          transform = `translate(0px, ${(90 * (1 - e)).toFixed(1)}px) rotate(${(-8 * (1 - e)).toFixed(2)}deg) scale(${sc})`;
          filter = `brightness(${(0.6 + 0.65 * e).toFixed(2)}) contrast(1.3) blur(${(6 * (1 - e)).toFixed(1)}px)`;
          opacity = 0.3 + 0.7 * e;
        } else {
          // 2단계: 발작
          if (now >= nextBurst) {
            burstUntil = now + 110 + Math.random() * 110;
            nextBurst = now + 450 + Math.random() * 500;
          }
          if (now >= nextJitter) {
            nextJitter = now + 30 + Math.random() * 30;
            const burst = now < burstUntil;
            const amp = (burst ? 75 : 34) * P;
            st.x = rnd(amp);
            st.y = rnd(amp * 0.8);
            st.r = rnd((burst ? 13 : 6) * P);
            st.s = ((burst ? 1.65 : 1.4) + Math.random() * 0.25 * P) * o.size;
            st.skew = rnd(burst ? 9 : 3);
            st.flip = 1;
          }
          transform = `translate(${st.x.toFixed(1)}px, ${st.y.toFixed(1)}px) rotate(${st.r.toFixed(2)}deg) skewX(${st.skew.toFixed(2)}deg) scale(${(st.s * st.flip).toFixed(3)}, ${st.s.toFixed(3)})`;

          filter = BASE_FILTER; // 밝기/색은 고정 (깜빡임 없음)
        }

        img.style.transform = transform;
        img.style.opacity = opacity;
        if (filter !== lastFilter) { img.style.filter = filter; lastFilter = filter; }

        // 화면 전체 흔들림
        if (o.shake > 0 && now >= nextShake) {
          nextShake = now + 30;
          const a = 16 * P * o.shake;
          const tr = `translate(${rnd(a).toFixed(1)}px, ${rnd(a).toFixed(1)}px) rotate(${rnd(1.4 * P * o.shake).toFixed(2)}deg) scale(1.05)`;
          (shakeTargets || []).forEach(el => { if (el) el.style.transform = tr; });
        }

        nttFx.raf = requestAnimationFrame(frame);
      }

      nttFx.raf = requestAnimationFrame(frame);
    }

    function triggerMonsterTrap(roomName) {
      if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver) return;
      window.gameState.isJumpscarePlaying = true;
      window.gameState.livesLost += 1;
      updateLivesDisplay();

      const SCREEN_TIME_MS = 3000;
      audio.playEntityJumpscare(roomName);
      if (navigator.vibrate) navigator.vibrate([150, 70, 300, 70, 600]);

      const monsterFile = roomMonsters[roomName] || './B_ntt.png';
      const jsImg = document.getElementById('jumpscare-img');
      const jsLayer = document.getElementById('jumpscare-layer');
      const jsTint = document.getElementById('jumpscare-tint');
      const stage = document.getElementById('scene-interactive-area');
      const gameContainer = document.getElementById('game-container');

      jsLayer.style.backgroundColor = '#000000';
      if (jsTint) {
        jsTint.classList.remove('hidden');
        jsTint.classList.add('strobe-active');
      }

      jsImg.src = monsterFile;
      jsImg.classList.remove('skibidi-active');
      startNttFx(jsImg, [stage, gameContainer], { duration: SCREEN_TIME_MS });
      jsLayer.classList.remove('hidden');

      setTimeout(() => {
        stopNttFx();
        if (jsTint) jsTint.classList.remove('strobe-active');
        jsLayer.classList.add('hidden');
        audio.stopJumpscare();
        window.gameState.isJumpscarePlaying = false;

        if (window.gameState.livesLost >= window.gameState.maxStrikes) {
          triggerGameOver();
        }
      }, SCREEN_TIME_MS);
    }

    function triggerSkibidiEvent() {
      if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver) return;
      window.gameState.isJumpscarePlaying = true;

      audio.playSkibidiFlush();
      if (navigator.vibrate) navigator.vibrate(60);

      const jsImg = document.getElementById('jumpscare-img');
      const jsLayer = document.getElementById('jumpscare-layer');
      const jsTint = document.getElementById('jumpscare-tint');

      jsLayer.style.backgroundColor = 'transparent';
      if (jsTint) {
        jsTint.classList.remove('strobe-active');
        jsTint.classList.add('hidden');
      }

      jsImg.src = './skibidi_ntt.png';
      jsImg.classList.remove('skibidi-active');
      startNttFx(jsImg,
        [document.getElementById('scene-interactive-area'), document.getElementById('game-container')],
        { duration: 1000, power: 0.9, size: 0.85, shake: 0.5 });
      jsLayer.classList.remove('hidden');

      setTimeout(() => {
        stopNttFx();
        jsLayer.classList.add('hidden');
        jsLayer.style.backgroundColor = '#000000';
        if (jsTint) jsTint.classList.remove('hidden');
        window.gameState.isJumpscarePlaying = false;
      }, 1000);
    }

    function updateLivesDisplay() {
      const container = document.getElementById('lives-container');
      if (!container) return;
      container.innerHTML = '';
      
      for (let i = 0; i < window.gameState.maxStrikes; i++) {
        const dot = document.createElement('div');
        const isTriggered = i < window.gameState.livesLost;
        dot.className = `w-3 h-3 rounded-full transition-all duration-300 ${
          isTriggered 
            ? 'bg-red-600 shadow-[0_0_8px_#ef4444]' 
            : 'bg-neutral-800 border border-neutral-700'
        }`;
        container.appendChild(dot);
      }
    }

    function triggerGameOver() {
      window.gameState.isGameOver = true;
      audio.playGameOver();
      const goLayer = document.getElementById('gameover-layer');
      if (goLayer) {
        goLayer.classList.remove('hidden');
        goLayer.classList.add('flex');
      }
    }

    let idleInterval = null;
    function resetIdleTimer() {
      window.gameState.idleSeconds = 0;
    }

    function startIdleTracker() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = setInterval(() => {
        if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying || window.gameState.isModalOpen) return;
        window.gameState.idleSeconds += 1;
      }, 1000);
    }

    let exitWalkTimer = null;
    function changeRoom(newRoom) {
      if (!roomBackgrounds[newRoom]) return;
      window.gameState.currentRoom = newRoom;

      if (exitWalkTimer) {
        clearTimeout(exitWalkTimer);
        exitWalkTimer = null;
      }

      if (newRoom === 'EXIT') {
        exitWalkTimer = setTimeout(() => {
          if (window.gameState.currentRoom === 'EXIT' && !window.gameState.isGameOver && !window.gameState.isGameClear) {
            audio.playNttWalking();
          }
        }, 2000);
      }

      const diff = roomDifficultySettings[newRoom] || { idleThreshold: 35 };
      window.gameState.idleThresholdSeconds = diff.idleThreshold;

      const locText = document.getElementById('current-location-text');
      if (locText) locText.innerText = `구역: ${newRoom}`;

      const sceneBg = document.getElementById('scene-bg');
      if (sceneBg) sceneBg.src = roomBackgrounds[newRoom];

      updateRoomView();
      resetIdleTimer();
    }

    function updateRoomView() {
      const container = document.getElementById('hotspots-container');
      if (!container) return;
      container.innerHTML = '';

      const spots = roomHotspots[window.gameState.currentRoom] || [];
      spots.forEach(spot => {
        const el = document.createElement('div');
        el.className = spot.type === 'nav' ? 'hotspot-nav' : 'hotspot-target';
        el.style.left = spot.rect.left;
        el.style.top = spot.rect.top;
        el.style.width = spot.rect.width;
        el.style.height = spot.rect.height;

        const handleInteraction = (e) => {
          e.stopPropagation();
          if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying) return;

          if (window.gameState.idleSeconds >= window.gameState.idleThresholdSeconds) {
            triggerMonsterTrap(window.gameState.currentRoom);
            resetIdleTimer();
            return;
          }
          resetIdleTimer();
          spot.action();
        };

        el.addEventListener('click', handleInteraction);
        container.appendChild(el);
      });
    }

    function closePuzzleModal() {
      const modal = document.getElementById('puzzle-modal');
      if (modal) modal.classList.add('hidden');
      window.gameState.isModalOpen = false;
      resetIdleTimer();
    }
    window.closePuzzleModal = closePuzzleModal;

    function resetGame() {
      window.gameState.currentRoom = 'B2';
      window.gameState.livesLost = 0;
      window.gameState.inventory = [];
      window.gameState.isJumpscarePlaying = false;
      window.gameState.isGameOver = false;
      window.gameState.isGameClear = false;
      window.gameState.isModalOpen = false;
      window.gameState.idleSeconds = 0;
      window.gameState.flags = {
        b2PowerOn: false,
        b2DoorUnlocked: false,
        b1RoomPuzzleSolved: false,
        b1RightLeverFound: false,
        b1BossDoorUnlocked: false,
        libraryBossClueFound: false,
        libraryKeyFound: false,
        libraryDoorOpen: false,
        vendingMachineSolved: false,
        restaurantDoorOpen: false,
        restaurantToiletSoundPlayed: false,
        toiletKeycardFound: false,
        toiletMirrorBroken: false,
        exitBreakerPulled: false
      };

      if (exitWalkTimer) {
        clearTimeout(exitWalkTimer);
        exitWalkTimer = null;
      }

      const goLayer = document.getElementById('gameover-layer');
      if (goLayer) {
        goLayer.classList.add('hidden');
        goLayer.classList.remove('flex');
      }

      const gcLayer = document.getElementById('gameclear-layer');
      if (gcLayer) {
        gcLayer.classList.add('hidden');
        gcLayer.classList.remove('flex');
      }

      const titleScreen = document.getElementById('title-screen');
      if (titleScreen) titleScreen.classList.add('hidden');

      closePuzzleModal();

      const toast = document.getElementById('toast-notify');
      if (toast) toast.classList.add('hidden');

      updateLivesDisplay();
      renderInventory();
      changeRoom('B2');
      resetIdleTimer();
      audio.startBGM();
    }

    window.onload = function () {
      audio.init();
      startIdleTracker();
      updateLivesDisplay();
      renderInventory();

      const startBtn = document.getElementById('start-btn');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          resetGame();
        });
      }

      const retryBtn = document.getElementById('retry-btn');
      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          resetGame();
        });
      }

      const menuBtn = document.getElementById('menu-btn');
      if (menuBtn) {
        menuBtn.addEventListener('click', () => {
          const goLayer = document.getElementById('gameover-layer');
          if (goLayer) {
            goLayer.classList.add('hidden');
            goLayer.classList.remove('flex');
          }
          const titleScreen = document.getElementById('title-screen');
          if (titleScreen) titleScreen.classList.remove('hidden');
          audio.stopBGM();
        });
      }

      const clearRetryBtn = document.getElementById('clear-retry-btn');
      if (clearRetryBtn) {
        clearRetryBtn.addEventListener('click', () => {
          resetGame();
        });
      }

      const sceneArea = document.getElementById('scene-interactive-area');
      if (sceneArea) {
        sceneArea.addEventListener('click', () => {
          if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying) return;
          if (window.gameState.idleSeconds >= window.gameState.idleThresholdSeconds) {
            triggerMonsterTrap(window.gameState.currentRoom);
            resetIdleTimer();
            return;
          }
          audio.playClick();
          resetIdleTimer();
        });
      }
    };
  </script>
