<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>THE ROOMS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Creepster&family=Noto+Sans+KR:wght@400;700;900&display=swap');

    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #e5e5e5;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    }

    .font-mono-tech { font-family: 'Share Tech Mono', monospace, sans-serif; }
    .font-creepy { font-family: 'Creepster', cursive, sans-serif; }

    .vhs-overlay {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.015), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 4px 100%;
      pointer-events: none;
    }

    @keyframes violent-shake {
      0% { transform: translate(0, 0) scale(1.08) rotate(0deg); }
      15% { transform: translate(-24px, 18px) scale(1.18) rotate(-2deg); }
      30% { transform: translate(26px, -22px) scale(1.24) rotate(2deg); }
      45% { transform: translate(-22px, -24px) scale(1.26) rotate(-3deg); }
      60% { transform: translate(26px, 24px) scale(1.3) rotate(3deg); }
      75% { transform: translate(-20px, 16px) scale(1.22) rotate(-1deg); }
      100% { transform: translate(0, 0) scale(1.08) rotate(0deg); }
    }
    .shake-active { animation: violent-shake 0.06s infinite alternate; }

    @keyframes boing-wiggle {
      0% { transform: scale(0.2) rotate(-15deg); }
      35% { transform: scale(1.4) rotate(15deg); }
      60% { transform: scale(0.9) rotate(-8deg); }
      80% { transform: scale(1.15) rotate(5deg); }
      100% { transform: scale(1.05) rotate(0deg); }
    }
    .skibidi-active { animation: boing-wiggle 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    @keyframes blood-pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.75; }
      100% { opacity: 0.3; }
    }
    .jumpscare-blood-fx { animation: blood-pulse 0.25s infinite ease-in-out; }

    .interactive-hotspot {
      cursor: pointer;
      position: absolute;
      z-index: 25;
      background: rgba(255, 255, 255, 0.001);
      transition: all 0.15s ease;
    }
    .interactive-hotspot:hover, .interactive-hotspot:active {
      box-shadow: inset 0 0 24px rgba(255, 220, 90, 0.25), 0 0 10px rgba(255, 200, 80, 0.3);
      border: 1.5px dashed rgba(255, 235, 120, 0.5);
    }

    .danger-vignette { box-shadow: inset 0 0 120px rgba(220, 20, 20, 0.7); }
  </style>
</head>

<body class="w-screen h-screen flex items-center justify-center bg-black select-none overflow-hidden">

  <div id="game-container" class="relative w-full h-full max-w-[1440px] max-h-[920px] aspect-[16/10] bg-zinc-950 overflow-hidden shadow-2xl flex flex-col justify-between border border-zinc-900">
    
    <!-- Top HUD -->
    <header id="game-hud" class="relative z-30 flex items-center justify-between px-3 md:px-6 py-2 bg-black/85 backdrop-blur-md border-b border-zinc-800 text-zinc-300">
      <div class="flex items-center space-x-2">
        <span class="w-2.5 h-2.5 rounded-full bg-red-600 animate-ping inline-block"></span>
        <span id="current-location-text" class="text-xs md:text-sm font-mono-tech tracking-wider uppercase text-zinc-100 font-bold">구역: B2</span>
      </div>

      <!-- Lives (5 Strikes) Indicator -->
      <div class="flex items-center space-x-2">
        <span class="text-[11px] font-mono-tech tracking-widest text-zinc-400 hidden sm:inline">위험 감지:</span>
        <div id="lives-container" class="flex space-x-1.5">
          <div class="life-slot w-5 h-5 rounded border border-red-800 bg-red-950/60 flex items-center justify-center text-[10px] text-red-500 font-mono-tech">1</div>
          <div class="life-slot w-5 h-5 rounded border border-red-800 bg-red-950/60 flex items-center justify-center text-[10px] text-red-500 font-mono-tech">2</div>
          <div class="life-slot w-5 h-5 rounded border border-red-800 bg-red-950/60 flex items-center justify-center text-[10px] text-red-500 font-mono-tech">3</div>
          <div class="life-slot w-5 h-5 rounded border border-red-800 bg-red-950/60 flex items-center justify-center text-[10px] text-red-500 font-mono-tech">4</div>
          <div class="life-slot w-5 h-5 rounded border border-red-800 bg-red-950/60 flex items-center justify-center text-[10px] text-red-500 font-mono-tech">5</div>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <div id="idle-warning" class="hidden text-amber-400 flex items-center space-x-1 text-[11px] font-mono-tech animate-pulse">
          <i data-lucide="eye" class="w-3.5 h-3.5"></i>
          <span class="hidden xs:inline">시선 감지...</span>
        </div>

        <button id="sound-toggle-btn" class="p-1.5 rounded bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 transition-colors" title="음향 토글">
          <i data-lucide="volume-2" class="w-4 h-4" id="sound-icon"></i>
        </button>
      </div>
    </header>

    <!-- Main Viewport -->
    <main id="scene-viewport" class="relative flex-1 w-full h-full overflow-hidden bg-black flex items-center justify-center cursor-crosshair">
      <img id="scene-bg" src="./B2.jpg" alt="Room View" class="absolute inset-0 w-full h-full object-cover pointer-events-none transition-opacity duration-300 block z-0" />

      <!-- Interactive Hotspots Layer -->
      <div id="hotspots-layer" class="absolute inset-0 w-full h-full pointer-events-auto z-20"></div>

      <!-- Mouse Tooltip removed for pure atmospheric immersion -->

      <!-- Atmospheric Overlays -->
      <div class="vhs-overlay absolute inset-0 z-10 pointer-events-none"></div>
      <div id="danger-glow" class="absolute inset-0 z-10 pointer-events-none opacity-0 transition-opacity duration-500 danger-vignette"></div>

      <!-- Custom In-Game Puzzle Modals -->
      <div id="puzzle-modal" class="absolute inset-0 z-40 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="puzzle-card" class="bg-zinc-950 border border-zinc-700 rounded-xl p-5 max-w-sm w-full text-center shadow-2xl relative">
          <!-- Dynamic Modal Content Injected Here -->
        </div>
      </div>
    </main>

    <!-- Bottom Inventory & Navigation -->
    <footer id="inventory-bar" class="relative z-30 px-3 md:px-6 py-2 bg-black/90 border-t border-zinc-800 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center space-x-2 md:space-x-3">
        <span class="text-[11px] md:text-xs font-mono-tech text-zinc-400 uppercase tracking-wider">소지품:</span>
        <div id="inventory-slots" class="flex space-x-1.5 md:space-x-2">
          <div class="inv-slot w-10 h-10 md:w-11 md:h-11 rounded border border-dashed border-zinc-700 bg-zinc-900/60 flex items-center justify-center text-zinc-500 text-[10px]" data-slot="0">비어있음</div>
          <div class="inv-slot w-10 h-10 md:w-11 md:h-11 rounded border border-dashed border-zinc-700 bg-zinc-900/60 flex items-center justify-center text-zinc-500 text-[10px]" data-slot="1">비어있음</div>
          <div class="inv-slot w-10 h-10 md:w-11 md:h-11 rounded border border-dashed border-zinc-700 bg-zinc-900/60 flex items-center justify-center text-zinc-500 text-[10px]" data-slot="2">비어있음</div>
          <div class="inv-slot w-10 h-10 md:w-11 md:h-11 rounded border border-dashed border-zinc-700 bg-zinc-900/60 flex items-center justify-center text-zinc-500 text-[10px]" data-slot="3">비어있음</div>
        </div>
      </div>

      <div class="flex items-center space-x-2 text-[11px] font-mono-tech text-zinc-400">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500/80 mr-1 animate-pulse"></span>
        <span id="quick-status-text">포인트 앤 클릭으로 탈출구를 탐색하십시오</span>
      </div>
    </footer>

    <!-- Jumpscare Overlay -->
    <div id="jumpscare-layer" class="absolute inset-0 z-50 bg-black hidden flex items-center justify-center overflow-hidden">
      <div class="absolute inset-0 bg-black pointer-events-none z-0"></div>
      <img id="jumpscare-img" src="./B_ntt.png" alt="Monster Jumpscare" class="w-full h-full object-contain filter contrast-125 brightness-95 drop-shadow-[0_0_80px_rgba(180,0,0,0.85)] pointer-events-none block z-10 scale-105" />
      <div id="jumpscare-tint" class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_45%,rgba(160,0,0,0.6)_85%,rgba(0,0,0,0.95)_100%)] pointer-events-none z-20 jumpscare-blood-fx"></div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-layer" class="absolute inset-0 z-50 bg-black hidden flex-col items-center justify-center">
      <img id="gameover-bg" src="./gameover.jpg" alt="Game Over" class="absolute inset-0 w-full h-full object-cover block z-0" />
      <div class="relative z-10 w-full h-full flex flex-col items-center justify-end pb-10 md:pb-14">
        <div class="flex items-center space-x-8 md:space-x-20 mb-3">
          <button id="btn-retry" class="px-5 py-2 md:px-7 md:py-2.5 bg-black/75 hover:bg-red-950/85 active:scale-95 border border-zinc-600 hover:border-red-500 rounded text-xs md:text-sm font-mono-tech text-zinc-100 hover:text-red-300 tracking-widest transition-all backdrop-blur-md shadow-2xl">다시 시도</button>
          <button id="btn-main-menu" class="px-5 py-2 md:px-7 md:py-2.5 bg-black/75 hover:bg-zinc-800/85 active:scale-95 border border-zinc-600 hover:border-zinc-300 rounded text-xs md:text-sm font-mono-tech text-zinc-100 hover:text-white tracking-widest transition-all backdrop-blur-md shadow-2xl">메인 메뉴</button>
        </div>
        <p class="text-[11px] font-mono-tech text-zinc-400 drop-shadow">괴물에게 5번 발각되어 백룸의 어둠에 삼켜졌습니다.</p>
      </div>
    </div>

    <!-- Game Clear Screen -->
    <div id="gameclear-layer" class="absolute inset-0 z-50 bg-black hidden flex flex-col items-center justify-center p-6 text-center">
      <div class="max-w-md p-6 md:p-8 rounded-xl bg-zinc-950/90 border border-emerald-500/60 shadow-[0_0_60px_rgba(16,185,129,0.25)] backdrop-blur-xl">
        <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-emerald-950/80 border border-emerald-500 flex items-center justify-center text-emerald-400">
          <i data-lucide="door-open" class="w-7 h-7"></i>
        </div>
        <h2 class="text-2xl md:text-3xl font-creepy text-emerald-400 mb-2 tracking-widest">탈출 성공 (ESCAPE CLEAR)</h2>
        <p class="text-xs md:text-sm font-mono-tech text-zinc-300 mb-5 leading-relaxed">
          화장실 바닥에서 찾아낸 최종 보안 키카드로 비상 탈출구(EXIT)를 개방하고 생존했습니다.
        </p>
        <button id="btn-clear-restart" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-black font-bold tracking-widest rounded uppercase font-mono-tech text-sm transition-all shadow-lg active:scale-95">
          처음부터 다시 도전
        </button>
      </div>
    </div>

    <!-- Title Screen -->
    <div id="title-screen" class="absolute inset-0 z-40 bg-black flex flex-col items-center justify-center p-4 text-center overflow-hidden">
      <img src="./start.jpg" alt="Title Background" class="absolute inset-0 w-full h-full object-cover opacity-60 filter contrast-125 pointer-events-none block z-0" />
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-black/80 pointer-events-none z-0"></div>

      <div class="max-w-md w-full p-6 md:p-8 rounded-xl bg-zinc-950/80 border border-zinc-800 backdrop-blur-md shadow-2xl relative z-10">
        <div class="inline-block px-3 py-0.5 mb-2 bg-red-900/80 text-red-300 text-[10px] font-mono-tech tracking-widest uppercase rounded border border-red-700">SURVIVAL POINT & CLICK HORROR</div>
        <h1 class="text-3xl md:text-5xl font-creepy tracking-wider text-red-600 mb-6 drop-shadow-[0_0_20px_rgba(220,38,38,0.85)]">THE ROOMS</h1>

        <button id="btn-start-game" class="w-full py-3.5 bg-red-700 hover:bg-red-600 text-white font-bold tracking-widest rounded uppercase font-mono-tech text-sm transition-all duration-150 active:scale-95 shadow-[0_0_25px_rgba(185,28,28,0.6)]">
          게임 시작 (START GAME)
        </button>
      </div>
    </div>
  </div>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmNodes = [];
        this.activeJumpscare = null;

        this.sfxPaths = {
        jumpscare: './SFX_Jumpscare.wav',
        click: './mouseClick.wav',
        door: './SFX_Player_DoorOpening.wav',
        item: './SFX_Player_ItemPickup.wav',
        skibidi: './28. 화장실물내려가는소리.wav',
        evilCrack: './Evil crack 03.wav'
      };
    }

    init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.startBGM();
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.muted) {
          this.stopBGM();
          this.stopJumpscare();
        } else {
          this.startBGM();
        }
        return this.muted;
      }

      startBGM() {
        if (this.muted) return;
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.bgmNodes.length > 0) return;

        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(74, now);

          const osc2 = this.ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(74.05, now);

          const oscOctave = this.ctx.createOscillator();
          oscOctave.type = 'triangle';
          oscOctave.frequency.setValueAtTime(148, now);

          const octaveGain = this.ctx.createGain();
          octaveGain.gain.setValueAtTime(0.025, now);
          oscOctave.connect(octaveGain);

          const mainFilter = this.ctx.createBiquadFilter();
          mainFilter.type = 'lowpass';
          mainFilter.frequency.setValueAtTime(200, now);
          mainFilter.Q.setValueAtTime(0.9, now);

          const filterLFO = this.ctx.createOscillator();
          filterLFO.frequency.setValueAtTime(0.055, now);
          const filterLFOGain = this.ctx.createGain();
          filterLFOGain.gain.setValueAtTime(70, now);
          filterLFO.connect(filterLFOGain);
          filterLFOGain.connect(mainFilter.frequency);

          const droneGain = this.ctx.createGain();
          droneGain.gain.setValueAtTime(0.15, now);

          const lfo1 = this.ctx.createOscillator();
          lfo1.frequency.setValueAtTime(0.071, now);
          const lfoGain1 = this.ctx.createGain();
          lfoGain1.gain.setValueAtTime(0.045, now);
          lfo1.connect(lfoGain1);
          lfoGain1.connect(droneGain.gain);

          const lfo2 = this.ctx.createOscillator();
          lfo2.frequency.setValueAtTime(0.043, now);
          const lfoGain2 = this.ctx.createGain();
          lfoGain2.gain.setValueAtTime(0.04, now);
          lfo2.connect(lfoGain2);
          lfoGain2.connect(droneGain.gain);

          const oscHum = this.ctx.createOscillator();
          oscHum.type = 'sine';
          oscHum.frequency.setValueAtTime(114, now);

          const oscTritone = this.ctx.createOscillator();
          oscTritone.type = 'sine';
          oscTritone.frequency.setValueAtTime(161.2, now);

          const eerieFilter = this.ctx.createBiquadFilter();
          eerieFilter.type = 'bandpass';
          eerieFilter.frequency.setValueAtTime(138, now);
          eerieFilter.Q.setValueAtTime(1.8, now);

          const eerieGain = this.ctx.createGain();
          eerieGain.gain.setValueAtTime(0.02, now);

          const eerieLFO = this.ctx.createOscillator();
          eerieLFO.frequency.setValueAtTime(0.038, now);
          const eerieLFOGain = this.ctx.createGain();
          eerieLFOGain.gain.setValueAtTime(0.025, now);
          eerieLFO.connect(eerieLFOGain);
          eerieLFOGain.connect(eerieGain.gain);

          oscHum.connect(eerieFilter);
          oscTritone.connect(eerieFilter);
          eerieFilter.connect(eerieGain);

          const bgmMaster = this.ctx.createGain();
          bgmMaster.gain.setValueAtTime(0.26, now);

          osc1.connect(mainFilter);
          osc2.connect(mainFilter);
          octaveGain.connect(mainFilter);
          mainFilter.connect(droneGain);
          droneGain.connect(bgmMaster);
          eerieGain.connect(bgmMaster);
          bgmMaster.connect(this.ctx.destination);

          osc1.start();
          osc2.start();
          oscOctave.start();
          filterLFO.start();
          lfo1.start();
          lfo2.start();
          oscHum.start();
          oscTritone.start();
          eerieLFO.start();

          this.bgmNodes = [
            osc1, osc2, oscOctave, octaveGain, mainFilter, filterLFO, filterLFOGain,
            droneGain, lfo1, lfoGain1, lfo2, lfoGain2,
            oscHum, oscTritone, eerieFilter, eerieGain, eerieLFO, eerieLFOGain,
            bgmMaster
          ];
        } catch (e) {}
      }

      stopBGM() {
        this.bgmNodes.forEach(node => {
          try {
            if (node.stop) node.stop();
            if (node.disconnect) node.disconnect();
          } catch (e) {}
        });
        this.bgmNodes = [];
      }

      playSound(name, volume = 0.6) {
        if (this.muted) return;
        const path = this.sfxPaths[name];
        if (!path) return;
        try {
          const sfx = new Audio(path);
          sfx.volume = volume;
          sfx.play().catch(() => {});
        } catch (e) {}
      }

      playClick() { this.playSound('click', 0.5); }
    playItemPickup() { this.playSound('item', 0.7); }
    playDoorOpen() { this.playSound('door', 0.75); }

    playEvilCrack() {
      this.playSound('evilCrack', 0.85);
    }

    // 짧은 고전압 전원 인가 및 릴레이 작동 효과음 (텍스트 없이 기믹 완수 체감)
    playPowerOnSound() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          
          // 1. 고전압 코일 험 & 상승 주파수 (전기 충전감)
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gainNode = this.ctx.createGain();

          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(60, now);
          osc1.frequency.exponentialRampToValueAtTime(320, now + 0.35);

          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(120, now);
          osc2.frequency.exponentialRampToValueAtTime(640, now + 0.35);

          // 2. 전기 스파크/필터
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(450, now);
          filter.Q.setValueAtTime(3.0, now);

          gainNode.gain.setValueAtTime(0.01, now);
          gainNode.gain.linearRampToValueAtTime(0.35, now + 0.1);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(gainNode);
          gainNode.connect(this.ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.46);
          osc2.stop(now + 0.46);
        } catch (e) {}
      }

      playJumpscare(targetDuration = 1.45) {
      if (this.muted) return;
      this.stopJumpscare();
      try {
        const sfx = new Audio(this.sfxPaths.jumpscare);
        sfx.volume = 1.0;
        this.activeJumpscare = sfx;
        const applyRateAndPlay = () => {
          if (sfx.duration && sfx.duration > 0) {
            const calcRate = sfx.duration / targetDuration;
            sfx.playbackRate = Math.min(Math.max(calcRate, 0.7), 3.0);
          } else {
            sfx.playbackRate = 1.35;
          }
          sfx.play().catch(() => {});
        };
        if (sfx.readyState >= 1) applyRateAndPlay();
        else sfx.addEventListener('loadedmetadata', applyRateAndPlay, { once: true });
      } catch (e) {}
    }

    // 스키비디 토일렛 전용: '28. 화장실물내려가는소리.wav'를 1초에 맞춰 고속 배속 재생
    playSkibidiFlush() {
      if (this.muted) return;
      try {
        const sfx = new Audio(this.sfxPaths.skibidi);
        sfx.volume = 0.9;
        const targetDuration = 1.0;
        const applyRateAndPlay = () => {
          if (sfx.duration && sfx.duration > 0) {
            sfx.playbackRate = Math.min(Math.max(sfx.duration / targetDuration, 1.0), 6.0);
          } else {
            sfx.playbackRate = 3.5;
          }
          sfx.play().catch(() => {});
          setTimeout(() => {
            try {
              sfx.pause();
              sfx.currentTime = 0;
            } catch(e) {}
          }, 1050);
        };
        if (sfx.readyState >= 1) applyRateAndPlay();
        else sfx.addEventListener('loadedmetadata', applyRateAndPlay, { once: true });
      } catch (e) {}
    }

    stopJumpscare() {
        if (this.activeJumpscare) {
          try {
            this.activeJumpscare.pause();
            this.activeJumpscare.currentTime = 0;
          } catch (e) {}
          this.activeJumpscare = null;
        }
      }

      playGameOver() {
        if (this.muted) return;
        this.stopBGM();
        this.playSound('jumpscare', 0.85);
      }
    }
    const audio = new SoundEngine();
  </script>

  <script>
    function addItem(name, icon, desc) {
      if (window.gameState.inventory.length >= 4) return;
      window.gameState.inventory.push({ name, icon, desc });
      renderInventory();
    }
    function hasItem(name) { return window.gameState.inventory.some(item => item.name === name); }

    function renderInventory() {
      const slots = document.querySelectorAll('.inv-slot');
      slots.forEach((slot, idx) => {
        const item = window.gameState.inventory[idx];
        if (item) {
          slot.innerHTML = `
            <div class="flex flex-col items-center justify-center p-0.5 text-center w-full h-full bg-zinc-800/90 rounded border border-amber-600/70 text-amber-300">
              <i data-lucide="${item.icon}" class="w-3.5 h-3.5 mb-0.5"></i>
              <span class="text-[7.5px] font-mono-tech leading-none truncate w-full">${item.name}</span>
            </div>
          `;
          slot.title = `${item.name}: ${item.desc}`;
        } else {
          slot.innerHTML = '비어있음';
          slot.className = 'inv-slot w-10 h-10 md:w-11 md:h-11 rounded border border-dashed border-zinc-700 bg-zinc-900/60 flex items-center justify-center text-zinc-500 text-[10px]';
          slot.title = '';
        }
      });
      if (window.lucide) lucide.createIcons();
    }

    function onHotspotClick(callback) {
      if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver || window.gameState.isGameClear) return;
      audio.init();

      if (window.gameState.idleSeconds >= window.gameState.idleThresholdSeconds) {
        window.gameState.idleSeconds = 0;
        resetIdleTimer();
        triggerMonsterTrap(window.gameState.currentRoom);
        return;
      }

      resetIdleTimer();
      if (navigator.vibrate) navigator.vibrate(25);
      callback();
    }

    // Modal Helper
    function openClueModal(title, textHtml) {
      audio.playClick();
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      card.innerHTML = `
        <h3 class="text-sm md:text-base font-bold text-amber-400 mb-2 font-mono-tech uppercase">${title}</h3>
        <div class="text-xs text-zinc-300 mb-4 leading-relaxed">${textHtml}</div>
        <button onclick="closePuzzleModal()" class="w-full py-2 bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 rounded font-mono-tech text-xs text-zinc-200">닫기 (확인)</button>
      `;
      modal.classList.remove('hidden');
    }

    function closePuzzleModal() {
      audio.playClick();
      document.getElementById('puzzle-modal').classList.add('hidden');
    }

    // B2 Logic: 배전함 올렸을 때만 전원음 1회, 문 열 때는 오직 문여는 소리만
    function handleB2Breaker() {
      if (!window.gameState.flags.b2PowerOn) {
        window.gameState.flags.b2PowerOn = true;
        // 전원 올렸을 때만 딱 한 번 전원음 출력 (모달 텍스트 없음)
        audio.playPowerOnSound();
      } else {
        audio.playClick();
      }
    }

    function handleB2Door() {
      if (!window.gameState.flags.b2PowerOn) {
        // 전원이 꺼져 있으면 클릭음만
        audio.playClick();
        return;
      }
      // 전원이 켜져 있으면 전원음 없이 오직 문 여는 소리만 나고 방 이동
      audio.playDoorOpen();
      setTimeout(() => changeRoom('B2_open'), 400);
    }

    // B1 & B1_room & B1_right Logic
    function handleB1BossDoor() {
      const cond1 = window.gameState.flags.b1RoomPuzzleSolved;
      const cond2 = window.gameState.flags.b1RightLeverFound;

      if (!cond1 || !cond2) {
        let msg = '서재 집무실로 통하는 계단 철문이 굳게 잠겨 있습니다.<br><br>';

  <script>
    function triggerMonsterTrap(roomName) {
      if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver) return;
      window.gameState.isJumpscarePlaying = true;
      window.gameState.livesLost += 1;
      updateLivesDisplay();

      const ENTITY_SCREEN_TIME_MS = 1450;
      audio.playJumpscare(ENTITY_SCREEN_TIME_MS / 1000);
      if (navigator.vibrate) navigator.vibrate([120, 60, 240, 60, 480]);

      const monsterFile = roomMonsters[roomName] || './B_ntt.png';
      const jsImg = document.getElementById('jumpscare-img');
      const jsLayer = document.getElementById('jumpscare-layer');
      const jsTint = document.getElementById('jumpscare-tint');
      const container = document.getElementById('game-container');

      // 일반 괴물 점프스케어: 붉은 혈흔 및 검은 배경 정상 노출
      jsLayer.style.backgroundColor = '#000000';
      if (jsTint) jsTint.classList.remove('hidden');
      jsImg.src = monsterFile;
      jsImg.classList.remove('skibidi-active');
      jsLayer.classList.remove('hidden');
      container.classList.add('shake-active');

      setTimeout(() => {
        container.classList.remove('shake-active');
        jsLayer.classList.add('hidden');
        audio.stopJumpscare();
        window.gameState.isJumpscarePlaying = false;

        if (window.gameState.livesLost >= window.gameState.maxStrikes) {
          triggerGameOver();
        }
      }, ENTITY_SCREEN_TIME_MS);
    }

    // 스키비디 토일렛 전용:
    // 1) 배경은 skibiditoilet.jpg 그대로 유지 (투명 오버레이)
    // 2) 붉은색 혈흔/점프스케어 효과(jsTint) 제거
    // 3) '28. 화장실물내려가는소리.wav'를 1초에 맞게 배속 재생
    // 4) 목숨 차감 없음
    function triggerSkibidiEvent() {
      if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver) return;
      window.gameState.isJumpscarePlaying = true;

      audio.playSkibidiFlush();
      if (navigator.vibrate) navigator.vibrate(60);

      const jsImg = document.getElementById('jumpscare-img');
      const jsLayer = document.getElementById('jumpscare-layer');
      const jsTint = document.getElementById('jumpscare-tint');

      // 배경 투명화 및 붉은 이펙트 숨김
      jsLayer.style.backgroundColor = 'transparent';
      if (jsTint) jsTint.classList.add('hidden');

      jsImg.src = './skibidi_ntt.png';
      jsImg.classList.add('skibidi-active');
      jsLayer.classList.remove('hidden');

      setTimeout(() => {
        jsImg.classList.remove('skibidi-active');
        jsLayer.classList.add('hidden');
        // 복구
        jsLayer.style.backgroundColor = '#000000';
        if (jsTint) jsTint.classList.remove('hidden');
        window.gameState.isJumpscarePlaying = false;
      }, 1000);
    }

    function updateLivesDisplay() {
      const slots = document.querySelectorAll('.life-slot');
      const dangerGlow = document.getElementById('danger-glow');
      slots.forEach((slot, index) => {
        if (index < window.gameState.livesLost) {
          slot.className = 'life-slot w-5 h-5 rounded border border-red-500 bg-red-600 text-black font-bold flex items-center justify-center text-[10px] font-mono-tech animate-pulse';
          slot.innerText = 'X';
        } else {
          slot.className = 'life-slot w-5 h-5 rounded border border-red-800 bg-red-950/60 flex items-center justify-center text-[10px] text-red-500 font-mono-tech';
          slot.innerText = (index + 1);
        }
      });
      dangerGlow.style.opacity = ((window.gameState.livesLost / window.gameState.maxStrikes) * 0.95).toString();
    }

    function triggerGameOver() {
      window.gameState.isGameOver = true;
      audio.playGameOver();
      const goLayer = document.getElementById('gameover-layer');
      goLayer.classList.remove('hidden');
      goLayer.classList.add('flex');
    }

    function changeRoom(newRoom) {
      if (!roomBackgrounds[newRoom]) return;
      window.gameState.currentRoom = newRoom;

      const diff = roomDifficultySettings[newRoom] || { idleThreshold: 12, label: '난이도: 보통' };
      window.gameState.idleThresholdSeconds = diff.idleThreshold;

      document.getElementById('current-location-text').innerText = `구역: ${newRoom} [${diff.label}]`;
      document.getElementById('scene-bg').src = roomBackgrounds[newRoom];

      updateRoomView();
      resetIdleTimer();
    }

    function updateRoomView() {
      const container = document.getElementById('hotspots-layer');
      container.innerHTML = '';
      const hotspots = roomHotspots[window.gameState.currentRoom] || [];

      hotspots.forEach(spot => {
        const div = document.createElement('div');
        div.className = 'interactive-hotspot';
        div.style.left = spot.rect.left;
        div.style.top = spot.rect.top;
        div.style.width = spot.rect.width;
        div.style.height = spot.rect.height;

        // 클릭 텍스트 툴팁 제거 (커서 반응 및 테두리 효과만 유지)
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          onHotspotClick(spot.action);
        });
        container.appendChild(div);
      });
    }

    function resetIdleTimer() {
      window.gameState.idleSeconds = 0;
      const warning = document.getElementById('idle-warning');
      if (warning) warning.classList.add('hidden');
    }

    function startIdleTracker() {
      if (window.gameState.idleTimerInterval) clearInterval(window.gameState.idleTimerInterval);
      window.gameState.idleTimerInterval = setInterval(() => {
        if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver || window.gameState.isGameClear) return;
        window.gameState.idleSeconds += 1;
        const warnTime = Math.max(3, Math.floor(window.gameState.idleThresholdSeconds * 0.6));
        if (window.gameState.idleSeconds >= warnTime) {
          document.getElementById('idle-warning').classList.remove('hidden');
        } else {
          document.getElementById('idle-warning').classList.add('hidden');
        }
      }, 1000);
    }

    function resetGame() {
      window.gameState.currentRoom = 'B2';
      window.gameState.livesLost = 0;
      window.gameState.inventory = [];
      window.gameState.isJumpscarePlaying = false;
      window.gameState.isGameOver = false;
      window.gameState.isGameClear = false;
      window.gameState.idleSeconds = 0;
      window.gameState.flags = {
        b2PowerOn: false, b2DoorUnlocked: false, b1RoomPuzzleSolved: false,
        b1RightLeverFound: false, b1BossDoorUnlocked: false, libraryBossClueFound: false,
        libraryKeyFound: false, libraryDoorOpen: false, vendingMachineSolved: false,
        restaurantDoorOpen: false, restaurantToiletSoundPlayed: false, toiletKeycardFound: false, exitBreakerPulled: false
      };

      document.getElementById('gameover-layer').classList.add('hidden');
      document.getElementById('gameover-layer').classList.remove('flex');
      document.getElementById('gameclear-layer').classList.add('hidden');
      document.getElementById('title-screen').classList.add('hidden');
      document.getElementById('puzzle-modal').classList.add('hidden');

      updateLivesDisplay();
      renderInventory();
      changeRoom('B2');
      resetIdleTimer();
      audio.startBGM();
    }

    window.onload = function () {
      if (window.lucide) lucide.createIcons();
      preloadAllImages();

      document.getElementById('btn-start-game').addEventListener('click', () => {
        audio.init();
        audio.playClick();
        resetGame();
        startIdleTracker();
      });

      document.getElementById('btn-retry').addEventListener('click', () => {
        audio.playClick();
        resetGame();
      });

      document.getElementById('btn-main-menu').addEventListener('click', () => {
        audio.playClick();
        document.getElementById('gameover-layer').classList.add('hidden');
        document.getElementById('gameover-layer').classList.remove('flex');
        document.getElementById('title-screen').classList.remove('hidden');
      });

      document.getElementById('btn-clear-restart').addEventListener('click', () => resetGame());

      document.getElementById('sound-toggle-btn').addEventListener('click', () => {
        const isMuted = audio.toggleMute();
        const icon = document.getElementById('sound-icon');
        icon.setAttribute('data-lucide', isMuted ? 'volume-x' : 'volume-2');
        if (window.lucide) lucide.createIcons();
      });

      document.getElementById('scene-viewport').addEventListener('click', (e) => {
        if (e.target.closest('.interactive-hotspot') || e.target.closest('#puzzle-modal')) return;
        if (window.gameState.idleSeconds >= window.gameState.idleThresholdSeconds) {
          window.gameState.idleSeconds = 0;
          resetIdleTimer();
          triggerMonsterTrap(window.gameState.currentRoom);
        } else {
          audio.playClick();
          resetIdleTimer();
        }
      });
    };
  </script>
</body>
</html>
