<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ROOMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    /* Base layout configuration */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color: #e5e5e5;
    }

    .font-creep { font-family: 'Creepster', cursive; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }

    /* Shake animation during jumpscare */
    @keyframes violent-shake {
      0% { transform: translate(0, 0) scale(1.02); }
      15% { transform: translate(-14px, 12px) scale(1.07); }
      30% { transform: translate(16px, -14px) scale(1.09); }
      45% { transform: translate(-18px, -10px) scale(1.06); }
      60% { transform: translate(14px, 16px) scale(1.08); }
      75% { transform: translate(-12px, 8px) scale(1.04); }
      100% { transform: translate(0, 0) scale(1); }
    }
    .shake-active {
      animation: violent-shake 0.12s infinite;
    }

    /* Pulsing horror vignette */
    @keyframes pulse-vignette {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 0.98; }
    }
    .vignette-pulse {
      animation: pulse-vignette 0.3s infinite alternate;
    }

    /* Skibidi toilet popup animation */
    @keyframes skibidi-rise {
      0% { transform: translateY(80%) scale(0.4); opacity: 0; }
      50% { transform: translateY(-8%) scale(1.15); opacity: 1; }
      75% { transform: translateY(4%) scale(1.05); }
      100% { transform: translateY(0%) scale(1.1); opacity: 1; }
    }
    .skibidi-active {
      animation: skibidi-rise 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    /* General invisible hotspot for objects/traps */
    .hotspot-target {
      position: absolute;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.001);
      z-index: 25;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot-target:active {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Persistent visible hotspot for room navigation */
    .hotspot-nav {
      position: absolute;
      cursor: pointer;
      border: 2px dashed rgba(255, 255, 255, 0.45);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(0, 0, 0, 0.02) 80%);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.12), inset 0 0 8px rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.1s ease;
      z-index: 26;
      animation: nav-pulse 2.2s infinite ease-in-out;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot-nav:hover, .hotspot-nav:active {
      border-color: rgba(239, 68, 68, 0.85);
      background: radial-gradient(circle, rgba(239, 68, 68, 0.25) 0%, rgba(0, 0, 0, 0.1) 80%);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.5);
      transform: scale(0.98);
    }

    @keyframes nav-pulse {
      0%, 100% {
        border-color: rgba(255, 255, 255, 0.3);
        opacity: 0.85;
      }
      50% {
        border-color: rgba(255, 255, 255, 0.7);
        opacity: 1;
      }
    }

    #viewport-container {
      width: 100%;
      max-width: 1000px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    #game-stage-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 10;
      background-color: #000000;
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
      border: 1px solid rgba(39, 39, 42, 0.6);
      overflow: hidden;
      margin: auto;
    }
  </style>
</head>

        <button id="start-btn" class="px-8 py-3 sm:px-10 sm:py-3.5 bg-red-950/80 hover:bg-red-900 border border-red-700/80 hover:border-red-500 text-red-200 rounded font-mono-tech text-sm sm:text-base tracking-widest transition-all shadow-[0_0_20px_rgba(220,38,38,0.4)]">게임 시작</button>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.bgmGain = null;
        this.muted = false;
        this.bgmNodes = [];
        this.activeJumpscareAudio = null;
        this.activeSadAudio = null;
        this.sadTimer = null;
        this.randomScreamInterval = null;

        this.sfxPaths = {
          click: './mouseClick.wav',
          door: './SFX_Player_DoorOpening.wav',
          item: './SFX_Player_ItemPickup.wav',
          skibidi: './뿌직.mp3',
          girlSad: './girl_sad.mp3',
          walking: './walking.m4a',
          nttWalking: './ntt_walking.mp3',
          darkSoulsDeath: './다크소울 죽음.m4a',
          pageFlip: './page-flip-6.wav',
          glassBreak: './쨍그랑.mp3',
          randomScream: './ntt_scream.mp3',
          b_scream: './b_nttscream.mp3',
          restaurant_scream: './restaurant_nttscream.m4a',
          exit_scream: './EXIT_nttscream.mp3',
          library_scream: './library_nttscream.m4a'
        };
      }

      init() {
        if (this.ctx) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        this.ctx = new AudioContextClass();

        const compressor = this.ctx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-18, this.ctx.currentTime);
        compressor.knee.setValueAtTime(24, this.ctx.currentTime);
        compressor.ratio.setValueAtTime(8, this.ctx.currentTime);
        compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
        compressor.release.setValueAtTime(0.25, this.ctx.currentTime);
        compressor.connect(this.ctx.destination);

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.9, this.ctx.currentTime);
        this.masterGain.connect(compressor);

        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        this.bgmGain.connect(this.masterGain);
      }

      startBGM() {
        this.init();
        if (!this.ctx || this.bgmNodes.length > 0) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        osc1.type = 'sine';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(78.0, this.ctx.currentTime);
        osc2.frequency.setValueAtTime(78.06, this.ctx.currentTime);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(160, this.ctx.currentTime);

        const filterLfo = this.ctx.createOscillator();
        const filterLfoGain = this.ctx.createGain();
        filterLfo.frequency.setValueAtTime(0.055, this.ctx.currentTime);
        filterLfoGain.gain.setValueAtTime(75, this.ctx.currentTime);
        filterLfo.connect(filterLfoGain);
        filterLfoGain.connect(filter.frequency);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(this.bgmGain);

        osc1.start();
        osc2.start();
        filterLfo.start();

        this.bgmNodes = [osc1, osc2, filterLfo];
        this.startRandomAmbientScreams();
      }

      stopBGM() {
        this.bgmNodes.forEach(n => {
          try { n.stop(); n.disconnect(); } catch (e) {}
        });
        this.bgmNodes = [];
        this.stopRandomAmbientScreams();
      }

      startRandomAmbientScreams() {
        this.stopRandomAmbientScreams();
        this.randomScreamInterval = setInterval(() => {
          if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying) return;
          if (Math.random() < 0.35) {
            this.playSound('randomScream', 0.16);
          }
        }, 14000);
      }

      stopRandomAmbientScreams() {
        if (this.randomScreamInterval) {
          clearInterval(this.randomScreamInterval);
          this.randomScreamInterval = null;
        }
      }

      playSound(name, volume = 0.7) {
        if (this.muted) return;
        const path = this.sfxPaths[name];
        if (!path) return;
        try {
          const audioEl = new Audio(path);
          audioEl.volume = Math.max(0, Math.min(1, volume));
          audioEl.play().catch(() => {});
        } catch (e) {}
      }

      playClick() { this.playSound('click', 0.5); }
      playItemPickup() { this.playSound('item', 0.7); }
      playDoorOpen() { this.playSound('door', 0.75); }
      playWalking() { this.playSound('walking', 0.65); }
      playPageFlip() { this.playSound('pageFlip', 0.75); }
      playGlassBreak() { this.playSound('glassBreak', 0.25); }
      playNttWalking() { this.playSound('nttWalking', 0.6); }

      playGirlSad() {
        if (this.muted) return;
        try {
          if (this.activeSadAudio) {
            try { this.activeSadAudio.pause(); } catch(e) {}
          }
          if (this.sadTimer) {
            clearTimeout(this.sadTimer);
          }
          const audioEl = new Audio(this.sfxPaths.girlSad);
          audioEl.volume = 0.18;
          this.activeSadAudio = audioEl;
          audioEl.play().catch(() => {});

          this.sadTimer = setTimeout(() => {
            if (this.activeSadAudio) {
              try { this.activeSadAudio.pause(); } catch(e) {}
              this.activeSadAudio = null;
            }
          }, 27000);
        } catch (e) {}
      }

      playPowerOnSound() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(60, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.35);

          gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.45);
        } catch (e) {}
      }

      playSkibidiFlush() {
        if (this.muted) return;
        try {
          const sfx = new Audio(this.sfxPaths.skibidi);
          sfx.volume = 0.85;
          sfx.play().catch(() => {});
        } catch (e) {}
      }

      playEntityJumpscare(roomName) {
        if (this.muted) return;
        this.stopJumpscare();

        let soundKey = 'b_scream';
        if (roomName === 'library' || roomName === 'library_boss') {
          soundKey = 'library_scream';
        } else if (roomName === 'restaurant' || roomName === 'restaurant_toilet' || roomName === 'toilet') {
          soundKey = 'restaurant_scream';
        } else if (roomName === 'EXIT') {
          soundKey = 'exit_scream';
        }

        const path = this.sfxPaths[soundKey];
        if (!path) return;
        try {
          const audioEl = new Audio(path);
          audioEl.volume = 0.85;
          this.activeJumpscareAudio = audioEl;
          audioEl.play().catch(() => {});
        } catch (e) {}
      }

      stopJumpscare() {
        if (this.activeJumpscareAudio) {
          try {
            this.activeJumpscareAudio.pause();
            this.activeJumpscareAudio.currentTime = 0;
          } catch (e) {}
          this.activeJumpscareAudio = null;
        }
      }

      playGameOver() {
        if (this.muted) return;
        this.stopBGM();
        if (this.activeSadAudio) {
          try { this.activeSadAudio.pause(); } catch(e) {}
        }
        this.playSound('darkSoulsDeath', 0.45);
      }
    }

    const audio = new SoundEngine();
    window.audio = audio;
  </script>

  <script>
    window.gameState = {
      currentRoom: 'B2',
      maxStrikes: 5,
      livesLost: 0,
      inventory: [],
      isJumpscarePlaying: false,
      isGameOver: false,
      isGameClear: false,
      isModalOpen: false,
      idleSeconds: 0,
      idleThresholdSeconds: 35,
      flags: {
        b2PowerOn: false,
        b2DoorUnlocked: false,
        b1RoomPuzzleSolved: false,
        b1RightLeverFound: false,
        b1BossDoorUnlocked: false,
        libraryBossClueFound: false,
        libraryKeyFound: false,
        libraryDoorOpen: false,
        vendingMachineSolved: false,
        restaurantDoorOpen: false,
        restaurantToiletSoundPlayed: false,
        toiletKeycardFound: false,
        toiletMirrorBroken: false,
        exitBreakerPulled: false
      }
    };

    const roomBackgrounds = {
      'B2': './B2.jpg',
      'B2_open': './B2_open.jpg',
      'B1': './B1.jpg',
      'B1_room': './B1_room.jpg',
      'B1_right': './B1_right.jpg',
      'library_boss': './library_boss.jpg',
      'library': './library.jpg',
      'restaurant': './restaurant.jpg',
      'restaurant_toilet': './restaurant_toilet.jpg',
      'toilet': './toilet.jpg',
      'skibiditoilet': './skibiditoilet.jpg',
      'EXIT': './EXIT.jpg'
    };

    const roomMonsters = {
      'B2': './B_ntt.png',
      'B2_open': './B_ntt.png',
      'B1': './B_ntt.png',
      'B1_room': './B_ntt.png',
      'B1_right': './B_ntt.png',
      'library_boss': './library_ntt.png',
      'library': './library_ntt.png',
      'restaurant': './restaurant_ntt.png',
      'restaurant_toilet': './restaurant_ntt.png',
      'toilet': './restaurant_ntt.png',
      'skibiditoilet': './skibidi_ntt.png',
      'EXIT': './EXIT_ntt.png'
    };

    const roomDifficultySettings = {
      'B2': { idleThreshold: 45 },
      'B2_open': { idleThreshold: 40 },
      'B1': { idleThreshold: 35 },
      'B1_room': { idleThreshold: 35 },
      'B1_right': { idleThreshold: 35 },
      'library_boss': { idleThreshold: 32 },
      'library': { idleThreshold: 30 },
      'restaurant': { idleThreshold: 28 },
      'restaurant_toilet': { idleThreshold: 28 },
      'toilet': { idleThreshold: 28 },
      'skibiditoilet': { idleThreshold: 35 },
      'EXIT': { idleThreshold: 24 }
    };

    // Instant image cache preload engine to avoid visual lag on mobile
    const preloadedImages = {};
    function preloadAllImages() {
      const allPaths = Object.values(roomBackgrounds).concat(Object.values(roomMonsters)).concat(['./start.jpg', './gameover.jpg']);
      allPaths.forEach(path => {
        const img = new Image();
        img.src = path;
        if (img.decode) {
          img.decode().catch(() => {});
        }
        preloadedImages[path] = img;
      });
    }
    preloadAllImages();

    // Hotspot coordinates configured for accurate 16:10 fixed aspect container
    const roomHotspots = {
      'B2': [
        { id: 'b2-breaker', type: 'obj', rect: { left: '3%', top: '24%', width: '10%', height: '28%' }, action: () => handleB2Breaker() },

  <script>
    let toastTimeout = null;
    function showToast(text) {
      const toast = document.getElementById('toast-notify');
      const toastText = document.getElementById('toast-text');
      if (!toast || !toastText) return;
      toastText.innerHTML = text;
      toast.classList.remove('hidden');
      toast.style.opacity = '1';
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.classList.add('hidden'), 200);
      }, 2600);
    }

    function addItem(name, label) {
      if (window.gameState.inventory.length >= 4) return;
      window.gameState.inventory.push({ name, label });
      renderInventory();
    }

    function renderInventory() {
      const container = document.getElementById('inventory-slots');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const item = window.gameState.inventory[i];
        const slot = document.createElement('div');
        slot.className = 'w-7 h-7 sm:w-9 sm:h-9 rounded border border-zinc-800 bg-zinc-950 flex items-center justify-center text-[9px] sm:text-[10px] font-mono-tech text-amber-400 p-0.5 text-center';
        if (item) {
          slot.innerText = item.label;
          slot.classList.add('border-amber-600/70', 'bg-zinc-900');
        } else {
          slot.innerText = '비어있음';
          slot.classList.add('text-zinc-700');
        }
        container.appendChild(slot);
      }
    }

    function handleB2Breaker() {
      if (!window.gameState.flags.b2PowerOn) {
        window.gameState.flags.b2PowerOn = true;
        audio.playPowerOnSound();
        showToast('배전반 전원 스위치 ON');
      } else {
        audio.playClick();
      }
    }

    function handleB2Door() {
      if (!window.gameState.flags.b2PowerOn) {
        audio.playClick();
        showToast('잠겨있다.');
        return;
      }
      audio.playDoorOpen();
      setTimeout(() => changeRoom('B2_open'), 300);
    }

    function handleB1BossDoor() {
      const cond1 = window.gameState.flags.b1RoomPuzzleSolved;
      const cond2 = window.gameState.flags.b1RightLeverFound;
      if (!cond1 || !cond2) {
        audio.playClick();
        showToast('잠겨있다.');
        return;
      }
      window.gameState.flags.b1BossDoorUnlocked = true;
      audio.playDoorOpen();
      setTimeout(() => changeRoom('library_boss'), 250);
    }

    function openB1ClueModal() {
      audio.playClick();
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      card.innerHTML = `
        <h3 class="text-xs sm:text-sm font-bold text-amber-400 mb-2 font-mono-tech">작업대 위의 낡은 엔지니어 다이어리</h3>
        <div class="p-2.5 sm:p-3 bg-zinc-900/90 border border-amber-900/50 rounded text-left mb-3 font-mono text-[11px] sm:text-xs text-zinc-300 leading-relaxed">
          <p class="mb-2 text-zinc-400">"정전 시 비상 전압 분배기 순서 복구 지침서"</p>
          <ul class="space-y-1 text-amber-200">
            <li>• <strong class="text-white">1번구 :</strong> 1을 제외한 홀수 중 최소 소수</li>
            <li>• <strong class="text-white">2번구 :</strong> 전체 중 최소 소수</li>
            <li>• <strong class="text-white">3번구 :</strong> 1~4 중 남은 유일한 홀수</li>
            <li>• <strong class="text-white">4번구 :</strong> 2의 거듭제곱 (2²)</li>
          </ul>
        </div>
        <button onclick="closePuzzleModal()" class="w-full py-2 bg-zinc-800 hover:bg-zinc-700 active:scale-95 border border-zinc-600 rounded font-mono-tech text-xs text-zinc-200 tracking-wider transition-all">닫기</button>
      `;
      modal.classList.remove('hidden');
    }

    let b1SwitchesState = [];
    function openB1RoomPuzzle() {
      if (window.gameState.flags.b1RoomPuzzleSolved) {
        showToast('동력 제어반 회로가 이미 정상 가동 중입니다.');
        return;
      }
      b1SwitchesState = [];
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      renderB1PuzzleUI(card);
      modal.classList.remove('hidden');
    }

    function renderB1PuzzleUI(card) {
      card.innerHTML = `
        <h3 class="text-xs sm:text-sm font-bold text-amber-400 mb-1 font-mono-tech">B1 동력 제어반 전압 회로</h3>
        <p class="text-[10px] sm:text-[11px] text-zinc-300 mb-2 leading-relaxed">
          작업대 다이어리의 수수께끼를 바탕으로 4개 스위치 번호를 순서대로 누르십시오.
        </p>
        <div class="grid grid-cols-4 gap-1.5 sm:gap-2 mb-3">
          <button onclick="pressB1Switch(1)" class="py-2.5 sm:py-3 bg-zinc-800 hover:bg-zinc-700 active:scale-95 border border-zinc-600 rounded text-xs sm:text-sm font-mono-tech text-amber-300 font-bold">SW 1</button>
          <button onclick="pressB1Switch(2)" class="py-2.5 sm:py-3 bg-zinc-800 hover:bg-zinc-700 active:scale-95 border border-zinc-600 rounded text-xs sm:text-sm font-mono-tech text-amber-300 font-bold">SW 2</button>
          <button onclick="pressB1Switch(3)" class="py-2.5 sm:py-3 bg-zinc-800 hover:bg-zinc-700 active:scale-95 border border-zinc-600 rounded text-xs sm:text-sm font-mono-tech text-amber-300 font-bold">SW 3</button>
          <button onclick="pressB1Switch(4)" class="py-2.5 sm:py-3 bg-zinc-800 hover:bg-zinc-700 active:scale-95 border border-zinc-600 rounded text-xs sm:text-sm font-mono-tech text-amber-300 font-bold">SW 4</button>
        </div>
        <div class="text-[10px] sm:text-[11px] font-mono-tech text-zinc-300 mb-3">입력 순서: [ ${b1SwitchesState.join(' - ') || '대기 중'} ]</div>
        <div class="flex space-x-2">
          <button onclick="resetB1Puzzle()" class="w-1/2 py-2 bg-zinc-900 border border-zinc-700 rounded text-xs text-zinc-400">초기화</button>
          <button onclick="closePuzzleModal()" class="w-1/2 py-2 bg-zinc-800 border border-zinc-600 rounded text-xs text-zinc-200">닫기</button>
        </div>
      `;
    }

    window.pressB1Switch = function(num) {
      audio.playClick();
      b1SwitchesState.push(num);
      const card = document.getElementById('puzzle-card');
      renderB1PuzzleUI(card);

      const target = [3, 2, 1, 4];
      if (b1SwitchesState.length === 4) {
        if (b1SwitchesState.every((v, i) => v === target[i])) {
          window.gameState.flags.b1RoomPuzzleSolved = true;
          audio.playPowerOnSound();
          closePuzzleModal();
          showToast('동력 제어반 전압 회로 연결 완료');
        } else {
          setTimeout(() => {
            b1SwitchesState = [];
            renderB1PuzzleUI(card);
            audio.playClick();
          }, 350);
        }
      }
    };

    window.resetB1Puzzle = function() {
      b1SwitchesState = [];
      renderB1PuzzleUI(document.getElementById('puzzle-card'));
    };

    let b1LockerCode = '';
    function handleB1RightLocker() {
      if (window.gameState.flags.b1RightLeverFound) {
        audio.playClick();
        return;
      }
      b1LockerCode = '';
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      renderB1LockerUI(card);
      modal.classList.remove('hidden');
    }

    function renderB1LockerUI(card) {
      card.innerHTML = `
        <h3 class="text-xs sm:text-sm font-bold text-amber-400 mb-1 font-mono-tech">라커 다이얼</h3>
        <p class="text-[10px] sm:text-[11px] text-zinc-300 mb-2 leading-relaxed">
          녹슨 라커 손잡이에 긁힌 글귀:<br>
          <span class="text-amber-300 font-mono text-xs">"1을 제외한 가장 작은 제곱수 / 0~9의 정중앙 수 / 3²"</span>
        </p>
        <div class="w-full py-2 bg-black border border-amber-800 rounded font-mono text-base text-amber-400 tracking-widest text-center mb-2.5">
          ${b1LockerCode ? b1LockerCode.padEnd(3, ' _ ') : '_ _ _'}
        </div>
        <div class="grid grid-cols-3 gap-1.5 mb-2.5 max-w-[210px] mx-auto">
          ${[1,2,3,4,5,6,7,8,9].map(n => `
            <button onclick="pressLockerNum('${n}')" class="py-2 sm:py-2.5 bg-zinc-800 hover:bg-zinc-700 active:scale-95 border border-zinc-700 rounded font-mono text-xs sm:text-sm text-zinc-200">${n}</button>
          `).join('')}
          <button onclick="clearLockerNum()" class="py-2 sm:py-2.5 bg-zinc-900 border border-zinc-700 rounded font-mono text-xs text-zinc-400">C</button>
          <button onclick="pressLockerNum('0')" class="py-2 sm:py-2.5 bg-zinc-800 hover:bg-zinc-700 active:scale-95 border border-zinc-700 rounded font-mono text-xs sm:text-sm text-zinc-200">0</button>
          <button onclick="closePuzzleModal()" class="py-2 sm:py-2.5 bg-zinc-900 border border-zinc-700 rounded font-mono text-xs text-zinc-400">닫기</button>
        </div>
      `;
    }

    window.pressLockerNum = function(n) {
      audio.playClick();
      if (b1LockerCode.length < 3) b1LockerCode += n;
      renderB1LockerUI(document.getElementById('puzzle-card'));

      if (b1LockerCode.length === 3) {
        if (b1LockerCode === '459') {
          window.gameState.flags.b1RightLeverFound = true;
          addItem('비상 계단 레버', '레버');
          audio.playItemPickup();
          closePuzzleModal();
          showToast('비상 계단 레버 획득');
        } else {
          setTimeout(() => {
            b1LockerCode = '';
            renderB1LockerUI(document.getElementById('puzzle-card'));
          }, 350);
        }
      }
    };
    window.clearLockerNum = function() {
      b1LockerCode = '';
      renderB1LockerUI(document.getElementById('puzzle-card'));
    };

    function handleLibraryBossBook() {
      window.gameState.flags.libraryBossClueFound = true;
      audio.playPageFlip();
      showToast('고서의 메모: "서재(library) 좌측 고서적 서가 가장 밑단 흑색 서적 뒤편"');
    }

    function handleLibrarySecretShelf() {
      if (!window.gameState.flags.libraryBossClueFound) {
        audio.playClick();
        return;
      }
      if (!window.gameState.flags.libraryKeyFound) {
        window.gameState.flags.libraryKeyFound = true;
        addItem('식당 열쇠', '열쇠');
        audio.playItemPickup();
        showToast('식당 열쇠 획득');
      } else {
        audio.playClick();
      }
    }

    function handleLibraryDoor() {
      if (!window.gameState.flags.libraryKeyFound) {
        audio.playClick();
        showToast('잠겨있다.');
        return;
      }
      window.gameState.flags.libraryDoorOpen = true;
      audio.playDoorOpen();
      setTimeout(() => changeRoom('restaurant'), 200);
    }

    function openVendingPuzzle() {
      audio.playClick();
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      card.innerHTML = `
        <h3 class="text-xs sm:text-sm font-bold text-amber-400 mb-1 font-mono-tech">고장난 자판기</h3>
        <p class="text-[10px] sm:text-xs text-zinc-300 mb-2 leading-relaxed">
          배출구에서 찢겨진 관리 수식 쪽지가 떨어집니다.
        </p>
        <div class="p-2 sm:p-2.5 bg-zinc-900 border border-dashed border-amber-600 rounded text-left mb-3 font-mono text-[10px] sm:text-[11px] text-zinc-300 leading-relaxed">
          <span class="text-amber-400 font-bold block mb-1">■ EXIT 도어락 4자리 조합식</span>
          • 앞 2자리 (X) : 7 × 8 = ?<br>
          • 뒤 2자리 (Y) : 100 - 63 = ?<br>
          <span class="text-amber-300 font-bold block mt-1">➔ PW = [ X ][ Y ]</span>
        </div>
        <button onclick="closePuzzleModal()" class="w-full py-2 bg-zinc-800 border border-zinc-600 rounded font-mono-tech text-xs text-zinc-200">닫기</button>
      `;
      modal.classList.remove('hidden');
    }

    let inputKeypadPw = '';
    function openRestaurantKeypad() {
      if (window.gameState.flags.restaurantDoorOpen) {
        audio.playWalking();
        setTimeout(() => changeRoom('EXIT'), 200);
        return;
      }
      inputKeypadPw = '';
      window.gameState.isModalOpen = true;
      const modal = document.getElementById('puzzle-modal');
      const card = document.getElementById('puzzle-card');
      renderKeypadUI(card);
      modal.classList.remove('hidden');
    }

    function renderKeypadUI(card) {
      card.innerHTML = `
        <h3 class="text-xs sm:text-sm font-bold text-red-500 mb-1 font-mono-tech">EXIT 보안 도어락</h3>
        <div class="w-full py-2 bg-black border border-red-800 rounded font-mono-tech text-base text-red-400 tracking-widest text-center mb-2.5">
          ${inputKeypadPw ? inputKeypadPw.padEnd(4, ' _ ') : '_ _ _ _'}
        </div>
        <div class="grid grid-cols-3 gap-1.5 mb-2.5 max-w-[210px] mx-auto">
          ${[1,2,3,4,5,6,7,8,9].map(n => `
            <button onclick="pressKeypadNum('${n}')" class="py-2 sm:py-2.5 bg-zinc-800 hover:bg-zinc-700 active:scale-95 border border-zinc-700 rounded font-mono-tech text-xs sm:text-sm text-zinc-200">${n}</button>
          `).join('')}
          <button onclick="clearKeypadNum()" class="py-2 sm:py-2.5 bg-zinc-900 border border-zinc-700 rounded font-mono-tech text-xs text-zinc-400">C</button>
          <button onclick="pressKeypadNum('0')" class="py-2 sm:py-2.5 bg-zinc-800 hover:bg-zinc-700 active:scale-95 border border-zinc-700 rounded font-mono-tech text-xs sm:text-sm text-zinc-200">0</button>
          <button onclick="closePuzzleModal()" class="py-2 sm:py-2.5 bg-zinc-900 border border-zinc-700 rounded font-mono-tech text-xs text-zinc-400">X</button>
        </div>
      `;
    }

    window.pressKeypadNum = function(n) {
      audio.playClick();
      if (inputKeypadPw.length < 4) inputKeypadPw += n;
      renderKeypadUI(document.getElementById('puzzle-card'));

      if (inputKeypadPw.length === 4) {
        if (inputKeypadPw === '5637') {
          window.gameState.flags.restaurantDoorOpen = true;
          audio.playDoorOpen();
          setTimeout(() => {
            closePuzzleModal();
            changeRoom('EXIT');
          }, 250);
        } else {
          setTimeout(() => {
            inputKeypadPw = '';
            renderKeypadUI(document.getElementById('puzzle-card'));
          }, 300);
        }
      }
    };
    window.clearKeypadNum = function() {
      inputKeypadPw = '';
      renderKeypadUI(document.getElementById('puzzle-card'));
    };

    function handleGoToRestaurantToilet() {
      if (!window.gameState.flags.restaurantToiletSoundPlayed) {
        window.gameState.flags.restaurantToiletSoundPlayed = true;
        audio.playGirlSad();
      } else {
        audio.playWalking();
      }
      setTimeout(() => changeRoom('restaurant_toilet'), 200);
    }

    function handleToiletMirror() {
      if (!window.gameState.flags.toiletMirrorBroken) {
        window.gameState.flags.toiletMirrorBroken = true;
        audio.playGlassBreak();
        showToast('거울에 금이 가며 깨지는 소리가 울렸습니다.');
      } else {
        audio.playClick();
      }
    }

    function handleToiletFloorTile() {
      if (!window.gameState.flags.toiletKeycardFound) {
        window.gameState.flags.toiletKeycardFound = true;
        addItem('EXIT 마스터 키카드', '키카드');
        audio.playItemPickup();
        showToast('EXIT 마스터 키카드 획득');
      } else {
        audio.playClick();
      }
    }

    function handleExitFireCabinet() {
      if (!window.gameState.flags.exitBreakerPulled) {
        window.gameState.flags.exitBreakerPulled = true;
        audio.playItemPickup();
        showToast('소화전 비상 전원 해제 완료');
      } else {
        audio.playClick();
      }
    }

    function handleFinalExitDoor() {
      const pwr = window.gameState.flags.exitBreakerPulled;
      const key = window.gameState.flags.toiletKeycardFound;
      if (!pwr || !key) {
        audio.playClick();
        showToast('잠겨있다.');
        return;
      }
      window.gameState.isGameClear = true;
      audio.playDoorOpen();
      document.getElementById('gameclear-layer').classList.remove('hidden');
      document.getElementById('gameclear-layer').classList.add('flex');
    }
  </script>

  <script>
    function triggerMonsterTrap(roomName) {
      if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver) return;
      window.gameState.isJumpscarePlaying = true;
      window.gameState.livesLost += 1;
      updateLivesDisplay();

      const SCREEN_TIME_MS = 3000;
      audio.playEntityJumpscare(roomName);
      if (navigator.vibrate) navigator.vibrate([150, 70, 300, 70, 600]);

      const monsterFile = roomMonsters[roomName] || './B_ntt.png';
      const jsImg = document.getElementById('jumpscare-img');
      const jsLayer = document.getElementById('jumpscare-layer');
      const jsTint = document.getElementById('jumpscare-tint');
      const container = document.getElementById('game-stage-wrapper');

      jsLayer.style.backgroundColor = '#000000';
      if (jsTint) jsTint.classList.remove('hidden');
      jsImg.src = monsterFile;
      jsImg.classList.remove('skibidi-active');
      jsLayer.classList.remove('hidden');
      if (container) container.classList.add('shake-active');

      setTimeout(() => {
        if (container) container.classList.remove('shake-active');
        jsLayer.classList.add('hidden');
        audio.stopJumpscare();
        window.gameState.isJumpscarePlaying = false;

        if (window.gameState.livesLost >= window.gameState.maxStrikes) {
          triggerGameOver();
        }
      }, SCREEN_TIME_MS);
    }

    function triggerSkibidiEvent() {
      if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver) return;
      window.gameState.isJumpscarePlaying = true;

      audio.playSkibidiFlush();
      if (navigator.vibrate) navigator.vibrate(60);

      const jsImg = document.getElementById('jumpscare-img');
      const jsLayer = document.getElementById('jumpscare-layer');
      const jsTint = document.getElementById('jumpscare-tint');

      jsLayer.style.backgroundColor = 'transparent';
      if (jsTint) jsTint.classList.add('hidden');

      jsImg.src = './skibidi_ntt.png';
      jsImg.classList.add('skibidi-active');
      jsLayer.classList.remove('hidden');

      setTimeout(() => {
        jsImg.classList.remove('skibidi-active');
        jsLayer.classList.add('hidden');
        jsLayer.style.backgroundColor = '#000000';
        if (jsTint) jsTint.classList.remove('hidden');
        window.gameState.isJumpscarePlaying = false;
      }, 1000);
    }

    function updateLivesDisplay() {
      const container = document.getElementById('lives-container');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < window.gameState.maxStrikes; i++) {
        const dot = document.createElement('span');
        dot.className = `w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full border border-red-500/80 transition-colors duration-300 ${
          i < window.gameState.livesLost ? 'bg-red-600 shadow-[0_0_8px_#ef4444]' : 'bg-zinc-900/80'
        }`;
        container.appendChild(dot);
      }
    }

    function triggerGameOver() {
      window.gameState.isGameOver = true;
      audio.playGameOver();
      const goLayer = document.getElementById('gameover-layer');
      if (goLayer) {
        goLayer.classList.remove('hidden');
        goLayer.classList.add('flex');
      }
    }

    let idleInterval = null;
    function resetIdleTimer() {
      window.gameState.idleSeconds = 0;
    }

    function startIdleTracker() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = setInterval(() => {
        if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying || window.gameState.isModalOpen) return;
        window.gameState.idleSeconds += 1;
      }, 1000);
    }

    let exitWalkTimer = null;
    function changeRoom(newRoom) {
      if (!roomBackgrounds[newRoom]) return;
      window.gameState.currentRoom = newRoom;

      if (exitWalkTimer) {
        clearTimeout(exitWalkTimer);
        exitWalkTimer = null;
      }

      if (newRoom === 'EXIT') {
        exitWalkTimer = setTimeout(() => {
          if (window.gameState.currentRoom === 'EXIT' && !window.gameState.isGameOver && !window.gameState.isGameClear) {
            audio.playNttWalking();
          }
        }, 2000);
      }

      const diff = roomDifficultySettings[newRoom] || { idleThreshold: 35 };
      window.gameState.idleThresholdSeconds = diff.idleThreshold;

      const locText = document.getElementById('current-location-text');
      if (locText) locText.innerText = `구역: ${newRoom}`;

      const sceneBg = document.getElementById('scene-bg');
      if (sceneBg) sceneBg.src = roomBackgrounds[newRoom];

      updateRoomView();
      resetIdleTimer();
    }

    function updateRoomView() {
      const container = document.getElementById('hotspots-container');
      if (!container) return;
      container.innerHTML = '';

      const spots = roomHotspots[window.gameState.currentRoom] || [];
      spots.forEach(spot => {
        const el = document.createElement('div');
        el.className = spot.type === 'nav' ? 'hotspot-nav' : 'hotspot-target';
        el.style.left = spot.rect.left;
        el.style.top = spot.rect.top;
        el.style.width = spot.rect.width;
        el.style.height = spot.rect.height;

        const handleInteraction = (e) => {
          e.stopPropagation();
          if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying) return;

          if (window.gameState.idleSeconds >= window.gameState.idleThresholdSeconds) {
            triggerMonsterTrap(window.gameState.currentRoom);
            resetIdleTimer();
            return;
          }
          resetIdleTimer();
          spot.action();
        };

        el.addEventListener('click', handleInteraction);
        container.appendChild(el);
      });
    }

    function closePuzzleModal() {
      const modal = document.getElementById('puzzle-modal');
      if (modal) modal.classList.add('hidden');
      window.gameState.isModalOpen = false;
      resetIdleTimer();
    }
    window.closePuzzleModal = closePuzzleModal;

    function resetGame() {
      window.gameState.currentRoom = 'B2';
      window.gameState.livesLost = 0;
      window.gameState.inventory = [];
      window.gameState.isJumpscarePlaying = false;
      window.gameState.isGameOver = false;
      window.gameState.isGameClear = false;
      window.gameState.isModalOpen = false;
      window.gameState.idleSeconds = 0;
      window.gameState.flags = {
        b2PowerOn: false,
        b2DoorUnlocked: false,
        b1RoomPuzzleSolved: false,
        b1RightLeverFound: false,
        b1BossDoorUnlocked: false,
        libraryBossClueFound: false,
        libraryKeyFound: false,
        libraryDoorOpen: false,
        vendingMachineSolved: false,
        restaurantDoorOpen: false,
        restaurantToiletSoundPlayed: false,
        toiletKeycardFound: false,
        toiletMirrorBroken: false,
        exitBreakerPulled: false
      };

      if (exitWalkTimer) {
        clearTimeout(exitWalkTimer);
        exitWalkTimer = null;
      }

      const goLayer = document.getElementById('gameover-layer');
      if (goLayer) {
        goLayer.classList.add('hidden');
        goLayer.classList.remove('flex');
      }

      const gcLayer = document.getElementById('gameclear-layer');
      if (gcLayer) {
        gcLayer.classList.add('hidden');
        gcLayer.classList.remove('flex');
      }

      const titleScreen = document.getElementById('title-screen');
      if (titleScreen) titleScreen.classList.add('hidden');

      closePuzzleModal();

      const toast = document.getElementById('toast-notify');
      if (toast) toast.classList.add('hidden');

      updateLivesDisplay();
      renderInventory();
      changeRoom('B2');
      resetIdleTimer();
      audio.startBGM();
    }

    window.onload = function () {
      audio.init();
      startIdleTracker();
      updateLivesDisplay();
      renderInventory();

      const startBtn = document.getElementById('start-btn');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          resetGame();
        });
      }

      const retryBtn = document.getElementById('retry-btn');
      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          resetGame();
        });
      }

      const menuBtn = document.getElementById('menu-btn');
      if (menuBtn) {
        menuBtn.addEventListener('click', () => {
          const goLayer = document.getElementById('gameover-layer');
          if (goLayer) {
            goLayer.classList.add('hidden');
            goLayer.classList.remove('flex');
          }
          const titleScreen = document.getElementById('title-screen');
          if (titleScreen) titleScreen.classList.remove('hidden');
          audio.stopBGM();
        });
      }

      const clearRetryBtn = document.getElementById('clear-retry-btn');
      if (clearRetryBtn) {
        clearRetryBtn.addEventListener('click', () => {
          resetGame();
        });
      }

      const sceneArea = document.getElementById('scene-interactive-area');
      if (sceneArea) {
        sceneArea.addEventListener('click', () => {
          if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying) return;
          if (window.gameState.idleSeconds >= window.gameState.idleThresholdSeconds) {
            triggerMonsterTrap(window.gameState.currentRoom);
            resetIdleTimer();
            return;
          }
          audio.playClick();
          resetIdleTimer();
        });
      }
    };
  </script>
</body>
</html>
