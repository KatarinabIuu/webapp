<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>THE ROOMS : 탈출</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background-color: #030303;
      color: #e5e5e5;
      overflow: hidden;
    }

    .font-creep { font-family: 'Creepster', cursive; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }

    /* Custom screen shake when jumpscare triggers */
    @keyframes violent-shake {
      0% { transform: translate(0, 0) scale(1.02); }
      15% { transform: translate(-14px, 12px) scale(1.07); }
      30% { transform: translate(16px, -14px) scale(1.09); }
      45% { transform: translate(-18px, -10px) scale(1.06); }
      60% { transform: translate(14px, 16px) scale(1.08); }
      75% { transform: translate(-12px, 8px) scale(1.04); }
      100% { transform: translate(0, 0) scale(1); }
    }
    .shake-active {
      animation: violent-shake 0.12s infinite;
    }

    /* Pulsing horror vignette */
    @keyframes pulse-vignette {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 0.98; }
    }
    .vignette-pulse {
      animation: pulse-vignette 0.28s infinite alternate;
    }

    /* Skibidi toilet popup animation */
    @keyframes skibidi-rise {
      0% { transform: translateY(80%) scale(0.4); opacity: 0; }
      50% { transform: translateY(-8%) scale(1.15); opacity: 1; }
      75% { transform: translateY(4%) scale(1.05); }
      100% { transform: translateY(0%) scale(1.1); opacity: 1; }
    }
    .skibidi-active {
      animation: skibidi-rise 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    /* Point-and-click invisible hotspot */
    .hotspot-target {
      position: absolute;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.001);
      transition: background 0.15s ease;
      z-index: 25;
    }
    .hotspot-target:active {
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.bgmGain = null;
        this.muted = false;
        this.bgmNodes = [];
        this.activeJumpscareAudio = null;

        // Registered audio paths
        this.sfxPaths = {
          jumpscare: './SFX_Jumpscare.wav',
          click: './mouseClick.wav',
          door: './SFX_Player_DoorOpening.wav',
          item: './SFX_Player_ItemPickup.wav',
          skibidi: './뿌직.mp3',
          warrior: './warrior.wav',
          walking: './walking.m4a',
          nttWalking: './ntt_walking.mp3',
          darkSoulsDeath: './다크소울 죽음.m4a',
          pageFlip: './page-flip-6.wav',
          glassBreak: './쨍그랑.mp3'
        };
      }

      init() {
        if (this.ctx) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        this.ctx = new AudioContextClass();

        const compressor = this.ctx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-18, this.ctx.currentTime);
        compressor.knee.setValueAtTime(24, this.ctx.currentTime);
        compressor.ratio.setValueAtTime(8, this.ctx.currentTime);
        compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
        compressor.release.setValueAtTime(0.25, this.ctx.currentTime);
        compressor.connect(this.ctx.destination);

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.9, this.ctx.currentTime);
        this.masterGain.connect(compressor);

        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        this.bgmGain.connect(this.masterGain);
      }

      startBGM() {
        this.init();
        if (!this.ctx || this.bgmNodes.length > 0) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        // 78Hz & 79Hz Sub Sine Waves for slow, organic ambient swells
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        osc1.type = 'sine';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(78.0, this.ctx.currentTime);
        osc2.frequency.setValueAtTime(78.06, this.ctx.currentTime);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(160, this.ctx.currentTime);

        const filterLfo = this.ctx.createOscillator();
        const filterLfoGain = this.ctx.createGain();
        filterLfo.frequency.setValueAtTime(0.055, this.ctx.currentTime);
        filterLfoGain.gain.setValueAtTime(75, this.ctx.currentTime);
        filterLfo.connect(filterLfoGain);
        filterLfoGain.connect(filter.frequency);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(this.bgmGain);

        osc1.start();
        osc2.start();
        filterLfo.start();

        this.bgmNodes = [osc1, osc2, filterLfo];
      }

      stopBGM() {
        this.bgmNodes.forEach(n => {
          try { n.stop(); n.disconnect(); } catch (e) {}
        });
        this.bgmNodes = [];
      }

      playSound(name, volume = 0.7) {
        if (this.muted) return;
        const path = this.sfxPaths[name];
        if (!path) return;
        try {
          const audioEl = new Audio(path);
          audioEl.volume = Math.max(0, Math.min(1, volume));
          audioEl.play().catch(() => {});
        } catch (e) {}
      }

      playClick() { this.playSound('click', 0.5); }
      playItemPickup() { this.playSound('item', 0.7); }
      playDoorOpen() { this.playSound('door', 0.75); }
      playWalking() { this.playSound('walking', 0.65); }
      playPageFlip() { this.playSound('pageFlip', 0.75); }
      playGlassBreak() { this.playSound('glassBreak', 0.8); }
      playWarrior() { this.playSound('warrior', 0.28); }
      playNttWalking() { this.playSound('nttWalking', 0.6); }

      playPowerOnSound() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(60, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.35);

          gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.45);
        } catch (e) {}
      }

      playSkibidiFlush() {
        if (this.muted) return;
        try {
          const sfx = new Audio(this.sfxPaths.skibidi);
          sfx.volume = 0.85;
          sfx.play().catch(() => {});
        } catch (e) {}
      }

      playJumpscare(durationSec = 1.45) {
        if (this.muted) return;
        try {
          this.stopJumpscare();
          const audioEl = new Audio(this.sfxPaths.jumpscare);
          audioEl.volume = 0.85;
          audioEl.playbackRate = 1.0;
          this.activeJumpscareAudio = audioEl;
          audioEl.play().catch(() => {});
        } catch (e) {}
      }

      stopJumpscare() {
        if (this.activeJumpscareAudio) {
          try {
            this.activeJumpscareAudio.pause();
            this.activeJumpscareAudio.currentTime = 0;
          } catch (e) {}
          this.activeJumpscareAudio = null;
        }
      }

      playGameOver() {
        if (this.muted) return;
        this.stopBGM();
        this.playSound('darkSoulsDeath', 0.45);
      }
    }

    // Globally accessible sound engine instance
    const audio = new SoundEngine();
    window.audio = audio;
  </script>

      const toast = document.getElementById('toast-notify');
      const toastText = document.getElementById('toast-text');
      if (!toast || !toastText) return;
      toastText.innerHTML = text;
      toast.classList.remove('hidden');
      toast.style.opacity = '1';
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.classList.add('hidden'), 200);
      }, 2600);
    }

      if (window.gameState.inventory.length >= 4) return;

    function renderInventory() {
      const container = document.getElementById('inventory-slots');

  <script>
    function triggerMonsterTrap(roomName) {
      if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver) return;
      window.gameState.isJumpscarePlaying = true;
      window.gameState.livesLost += 1;
      updateLivesDisplay();

      const SCREEN_TIME_MS = 1450;
      audio.playJumpscare(SCREEN_TIME_MS / 1000);
      if (navigator.vibrate) navigator.vibrate([120, 60, 240, 60, 480]);

      const monsterFile = roomMonsters[roomName] || './B_ntt.png';
      const jsImg = document.getElementById('jumpscare-img');
      const jsLayer = document.getElementById('jumpscare-layer');
      const jsTint = document.getElementById('jumpscare-tint');
      const container = document.getElementById('game-container');

      jsLayer.style.backgroundColor = '#000000';
      if (jsTint) jsTint.classList.remove('hidden');
      jsImg.src = monsterFile;
      jsImg.classList.remove('skibidi-active');
      jsLayer.classList.remove('hidden');
      container.classList.add('shake-active');

      setTimeout(() => {
        container.classList.remove('shake-active');
        jsLayer.classList.add('hidden');
        audio.stopJumpscare();
        window.gameState.isJumpscarePlaying = false;

        if (window.gameState.livesLost >= window.gameState.maxStrikes) {
          triggerGameOver();
        }
      }, SCREEN_TIME_MS);
    }

    function triggerSkibidiEvent() {
      if (window.gameState.isJumpscarePlaying || window.gameState.isGameOver) return;
      window.gameState.isJumpscarePlaying = true;

      audio.playSkibidiFlush();
      if (navigator.vibrate) navigator.vibrate(60);

      const jsImg = document.getElementById('jumpscare-img');
      const jsLayer = document.getElementById('jumpscare-layer');
      const jsTint = document.getElementById('jumpscare-tint');

      jsLayer.style.backgroundColor = 'transparent';
      if (jsTint) jsTint.classList.add('hidden');

      jsImg.src = './skibidi_ntt.png';
      jsImg.classList.add('skibidi-active');
      jsLayer.classList.remove('hidden');

      setTimeout(() => {
        jsImg.classList.remove('skibidi-active');
        jsLayer.classList.add('hidden');
        jsLayer.style.backgroundColor = '#000000';
        if (jsTint) jsTint.classList.remove('hidden');
        window.gameState.isJumpscarePlaying = false;
      }, 1000);
    }

    function updateLivesDisplay() {
      const container = document.getElementById('lives-container');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < window.gameState.maxStrikes; i++) {
        const dot = document.createElement('span');
        dot.className = `w-3 h-3 rounded-full border border-red-500/80 transition-colors duration-300 ${
          i < window.gameState.livesLost ? 'bg-red-600 shadow-[0_0_8px_#ef4444]' : 'bg-zinc-900/80'
        }`;
        container.appendChild(dot);
      }
    }

    function triggerGameOver() {
      window.gameState.isGameOver = true;
      audio.playGameOver();
      const goLayer = document.getElementById('gameover-layer');
      if (goLayer) {
        goLayer.classList.remove('hidden');
        goLayer.classList.add('flex');
      }
    }

    let idleInterval = null;
    function resetIdleTimer() {
      window.gameState.idleSeconds = 0;
    }

    function startIdleTracker() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = setInterval(() => {
        if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying) return;
        window.gameState.idleSeconds += 1;
      }, 1000);
    }

    let exitWalkTimer = null;
    function changeRoom(newRoom) {
      if (!roomBackgrounds[newRoom]) return;
      window.gameState.currentRoom = newRoom;

      if (exitWalkTimer) {
        clearTimeout(exitWalkTimer);
        exitWalkTimer = null;
      }

      if (newRoom === 'EXIT') {
        exitWalkTimer = setTimeout(() => {
          if (window.gameState.currentRoom === 'EXIT' && !window.gameState.isGameOver && !window.gameState.isGameClear) {
            audio.playNttWalking();
          }
        }, 2000);
      }

      const diff = roomDifficultySettings[newRoom] || { idleThreshold: 35 };
      window.gameState.idleThresholdSeconds = diff.idleThreshold;

      const locText = document.getElementById('current-location-text');
      if (locText) locText.innerText = `구역: ${newRoom}`;

      const sceneBg = document.getElementById('scene-bg');
      if (sceneBg) sceneBg.src = roomBackgrounds[newRoom];

      updateRoomView();
      resetIdleTimer();
    }

    function updateRoomView() {
      const container = document.getElementById('hotspots-container');
      if (!container) return;
      container.innerHTML = '';

      const spots = roomHotspots[window.gameState.currentRoom] || [];
      spots.forEach(spot => {
        const el = document.createElement('div');
        el.className = 'hotspot-target';
        el.style.left = spot.rect.left;
        el.style.top = spot.rect.top;
        el.style.width = spot.rect.width;
        el.style.height = spot.rect.height;

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying) return;

          if (window.gameState.idleSeconds >= window.gameState.idleThresholdSeconds) {
            triggerMonsterTrap(window.gameState.currentRoom);
            resetIdleTimer();
            return;
          }
          resetIdleTimer();
          spot.action();
        });

        container.appendChild(el);
      });
    }

    function closePuzzleModal() {
      const modal = document.getElementById('puzzle-modal');
      if (modal) modal.classList.add('hidden');
    }
    window.closePuzzleModal = closePuzzleModal;

    function resetGame() {
      window.gameState.currentRoom = 'B2';
      window.gameState.livesLost = 0;
      window.gameState.inventory = [];
      window.gameState.isJumpscarePlaying = false;
      window.gameState.isGameOver = false;
      window.gameState.isGameClear = false;
      window.gameState.idleSeconds = 0;
      window.gameState.flags = {
        b2PowerOn: false,
        b2DoorUnlocked: false,
        b1RoomPuzzleSolved: false,
        b1RightLeverFound: false,
        b1BossDoorUnlocked: false,
        libraryBossClueFound: false,
        libraryKeyFound: false,
        libraryDoorOpen: false,
        vendingMachineSolved: false,
        restaurantDoorOpen: false,
        restaurantToiletSoundPlayed: false,
        toiletKeycardFound: false,
        toiletMirrorBroken: false,
        exitBreakerPulled: false
      };

      if (exitWalkTimer) {
        clearTimeout(exitWalkTimer);
        exitWalkTimer = null;
      }

      const goLayer = document.getElementById('gameover-layer');
      if (goLayer) {
        goLayer.classList.add('hidden');
        goLayer.classList.remove('flex');
      }

      const gcLayer = document.getElementById('gameclear-layer');
      if (gcLayer) {
        gcLayer.classList.add('hidden');
        gcLayer.classList.remove('flex');
      }

      const titleScreen = document.getElementById('title-screen');
      if (titleScreen) titleScreen.classList.add('hidden');

      closePuzzleModal();

      const toast = document.getElementById('toast-notify');
      if (toast) toast.classList.add('hidden');

      updateLivesDisplay();
      renderInventory();
      changeRoom('B2');
      resetIdleTimer();
      audio.startBGM();
    }

    window.onload = function () {
      audio.init();
      startIdleTracker();
      updateLivesDisplay();
      renderInventory();

      const startBtn = document.getElementById('start-btn');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          resetGame();
        });
      }

      const retryBtn = document.getElementById('retry-btn');
      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          resetGame();
        });
      }

      const menuBtn = document.getElementById('menu-btn');
      if (menuBtn) {
        menuBtn.addEventListener('click', () => {
          const goLayer = document.getElementById('gameover-layer');
          if (goLayer) {
            goLayer.classList.add('hidden');
            goLayer.classList.remove('flex');
          }
          const titleScreen = document.getElementById('title-screen');
          if (titleScreen) titleScreen.classList.remove('hidden');
          audio.stopBGM();
        });
      }

      const clearRetryBtn = document.getElementById('clear-retry-btn');
      if (clearRetryBtn) {
        clearRetryBtn.addEventListener('click', () => {
          resetGame();
        });
      }

      const sceneArea = document.getElementById('scene-interactive-area');
      if (sceneArea) {
        sceneArea.addEventListener('click', () => {
          if (window.gameState.isGameOver || window.gameState.isGameClear || window.gameState.isJumpscarePlaying) return;
          if (window.gameState.idleSeconds >= window.gameState.idleThresholdSeconds) {
            triggerMonsterTrap(window.gameState.currentRoom);
            resetIdleTimer();
            return;
          }
          audio.playClick();
          resetIdleTimer();
        });
      }
    };
  </script>
</body>
</html>
